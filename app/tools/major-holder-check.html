<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>대주주 해당 여부 판정기</title><meta name="robots" content="noindex">
<style>:root{color-scheme:light}html,body{margin:0;background:#fff}.app-wrap{max-width:820px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}</style>
</head><body><div class="app-wrap"><div class="entry-content"><div data-sc-tool="major-holder-check"></div></div></div>
<script src="https://dooly870505-commits.github.io/stockchild-data/js/sc-ui.js?v=1.0"></script>
<script>
/* stockchild.com 대주주 해당 여부 판정기 (sc-tool-major-holder-check) v1.0 (2026-11-03)
   양도세 과세 대상 '대주주' 기준: 종목당 보유 시가총액 50억 원 이상(직전 사업연도 말) 또는 지분율 코스피 1%, 코스닥 2%, 코넥스 4% 이상.
   기준 금액·지분율은 제도 변경에 대비해 입력칸으로 열어 둠. 세율: 과세표준 3억 이하 20%, 초과 25% (지방소득세 별도 10% 가산) */
(function () {
  'use strict';
  if (!window.SCTools) return;
  var CSS = ['.mk{margin-top:12px}', '.verdict{font-size:30px;font-weight:800;letter-spacing:-0.02em}'].join('');
  var MK = { kospi: { l: '코스피', r: 1 }, kosdaq: { l: '코스닥', r: 2 }, konex: { l: '코넥스', r: 4 } };
  function render(wrap, U) {
    var S = { mk: 'kospi' };
    wrap.innerHTML = '<div class="sc-card">' +
      U.header('세금', '대주주 해당 여부 판정기', '연말 기준으로 한 종목을 얼마나 들고 있으면 양도세 내는 대주주가 되는지, 몇 주를 줄이면 벗어나는지 계산해요.') +
      '<div class="sc-sec"><div class="sc-chips mk" id="mk"><button class="sc-chip on" data-m="kospi">코스피 (1%)</button><button class="sc-chip" data-m="kosdaq">코스닥 (2%)</button><button class="sc-chip" data-m="konex">코넥스 (4%)</button></div>' +
      '<div class="sc-grid" style="margin-top:12px">' + U.field('qty', '보유 수량 (특수관계인 합산)', '주', '60,000') + U.field('price', '기준일 종가', '원', '90,000', '12월 결산법인은 그 해 마지막 거래일 종가') +
      U.field('shares', '총 발행주식수', '주', '5,000,000', '지분율 계산용. 모르면 비워도 돼요', true) +
      U.field('amtLimit', '금액 기준', '억원', '50', '현행 50억') + U.field('rateLimit', '지분율 기준', '%', '1', '시장 선택 시 자동 입력') + '</div></div>' +
      '<div class="sc-sec" id="out"></div>' +
      '<div class="sc-sec"><div class="sc-note"><b>기준일이 핵심이에요.</b> 금액 기준과 지분율 기준 모두 직전 사업연도 말(12월 결산법인은 12월 마지막 거래일) 보유분으로 판정하고, 지분율은 연중에 기준을 넘긴 날부터도 대주주로 봅니다. 주식은 체결 후 2영업일 뒤 결제되므로, 연말 기준일에 빠지려면 <b>마지막 거래일 2영업일 전까지 매도 체결</b>이 돼야 해요. 가족 등 특수관계인 보유분은 합산합니다(최대주주가 아니면 본인 기준).</div></div>' +
      U.foot('소득세법 시행령 기준(2026년). 세율은 과세표준 3억 이하 20%, 초과 25%, 1년 미만 보유 시 30%(중소기업 외), 지방소득세 10% 별도. 세무 상담을 대체하지 않습니다.') + '</div>';
    var $ = function (id) { return wrap.querySelector('#' + id); };
    function calc() {
      var q = U.val(wrap, 'qty'), p = U.val(wrap, 'price'), sh = U.val(wrap, 'shares'), aL = U.val(wrap, 'amtLimit') * 1e8, rL = U.val(wrap, 'rateLimit') / 100;
      if (!(q > 0 && p > 0 && aL > 0)) { $('out').innerHTML = '<div class="sc-note">보유 수량과 기준일 종가를 입력해 주세요.</div>'; return; }
      var amt = q * p, byAmt = amt >= aL, rate = sh > 0 ? q / sh : null, byRate = rate !== null && rL > 0 && rate >= rL;
      var major = byAmt || byRate;
      var sellAmt = byAmt ? Math.ceil((amt - aL) / p + 1e-9) + 1 : 0;  // 50억 '이상'이 기준이라 1주 더
      var sellRate = byRate ? Math.ceil(q - (rL * sh) + 1e-9) + 1 : 0;
      var needSell = Math.max(sellAmt, sellRate);
      var h = '<div class="sc-kpis">' +
        U.kpi('판정', '<span class="verdict ' + (major ? 'up' : 'down') + '">' + (major ? '대주주 해당' : '대주주 아님') + '</span>', major ? '양도차익에 양도세 과세' : '국내 상장주식 장내 양도차익 비과세', true) +
        U.kpi('보유 평가액', U.won(amt / 1e8 * 10) / 10 === 0 ? U.won(amt) + '<small>원</small>' : (amt / 1e8).toFixed(2) + '<small>억원</small>', '기준 ' + U.won(aL / 1e8) + '억 · ' + (byAmt ? '초과' : '여유 ' + ((aL - amt) / 1e8).toFixed(2) + '억')) +
        U.kpi('지분율', rate === null ? '-' : U.pct(rate, 3), rate === null ? '발행주식수를 넣으면 계산' : '기준 ' + U.pct(rL, 1) + ' · ' + (byRate ? '초과' : '여유 ' + U.pct(rL - rate, 3))) + '</div>';
      h += '<div class="sc-sec"><div class="sc-rows">' +
        U.row('금액 기준', byAmt ? '<span class="up">해당</span>' : '<span class="down">미해당</span>') + U.row('지분율 기준', rate === null ? '미입력' : byRate ? '<span class="up">해당</span>' : '<span class="down">미해당</span>') +
        (major ? U.row('기준일 전에 줄여야 할 수량', '<b>' + U.int(needSell) + '주</b> 이상 매도 (' + U.won(needSell * p) + '원어치)') : U.row('더 살 수 있는 여유', U.int(Math.max(0, Math.floor((aL - amt) / p) - 1)) + '주까지 (금액 기준)')) + '</div></div>';
      if (major) {
        h += '<div class="sc-sec"><div class="sc-sec-t">대주주가 되면 양도세는</div>' + U.table(['양도차익', '세율', '세금 (지방세 포함)'],
          [['3억 이하 부분', '20%', '22%'], ['3억 초과 부분', '25%', '27.5%'], ['1년 미만 보유 (중소기업 외)', '30%', '33%']]) +
          '<div class="sc-note" style="margin-top:10px">기본공제 연 250만 원. 대주주 판정은 종목별이지만 신고는 반기별로 합니다.</div></div>';
      }
      $('out').innerHTML = h;
    }
    U.bindInputs(wrap, ['qty', 'price', 'shares', 'amtLimit', 'rateLimit'], calc);
    $('mk').addEventListener('click', function (e) { var b = e.target.closest('[data-m]'); if (!b) return; S.mk = b.getAttribute('data-m');
      wrap.querySelectorAll('#mk .sc-chip').forEach(function (c) { c.classList.toggle('on', c === b); }); $('rateLimit').value = String(MK[S.mk].r); calc(); });
    calc();
  }
  function reg() { window.SCTools.register({ id: 'major-holder-check', css: CSS, render: render }); }
  if (window.SCTools) reg(); else document.addEventListener('DOMContentLoaded', function () { if (window.SCTools) reg(); });
})();

</script></body></html>
