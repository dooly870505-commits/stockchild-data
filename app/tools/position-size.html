<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>포지션 사이징 계산기</title><meta name="robots" content="noindex">
<style>:root{color-scheme:light}html,body{margin:0;background:#fff}.app-wrap{max-width:820px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}</style>
</head><body><div class="app-wrap"><div class="entry-content"><div data-sc-tool="position-size"></div></div></div>
<script src="https://dooly870505-commits.github.io/stockchild-data/js/sc-ui.js?v=1.0"></script>
<script>
/* stockchild.com 포지션 사이징 계산기 (sc-tool-position-size) v1.0 (2026-11-03)
   계좌에서 한 번에 잃어도 되는 비율(1% 룰)과 손절가를 정하면 몇 주까지 살 수 있는지, 비중과 손익비를 계산 */
(function () {
  'use strict';
  if (!window.SCTools) return;
  var CSS = ['.rr{font-size:12px;color:var(--muted)}'].join('');
  function render(wrap, U) {
    wrap.innerHTML = '<div class="sc-card">' +
      U.header('리스크', '포지션 사이징 계산기', '한 번 틀려도 계좌가 안 다치게. 감수할 손실과 손절가를 정하면 살 수 있는 수량을 계산해요.') +
      '<div class="sc-sec"><div class="sc-grid">' + U.field('acct', '계좌 총액', '원', '30,000,000') + U.field('risk', '한 종목에서 감수할 손실', '%', '1', '계좌 대비. 보통 0.5~2%') +
      U.field('entry', '매수가', '원', '50,000') + U.field('stop', '손절가', '원', '46,000') + U.field('target', '목표가', '원', '60,000', '손익비 계산용', true) + '</div></div>' +
      '<div class="sc-sec" id="out"></div>' +
      U.foot('수수료·세금·슬리피지는 반영하지 않았습니다. 손절가는 체결이 보장되지 않으니 갭 하락 위험이 있는 종목은 비율을 더 낮게 잡으세요.') + '</div>';
    var $ = function (id) { return wrap.querySelector('#' + id); };
    function calc() {
      var A = U.val(wrap, 'acct'), r = U.val(wrap, 'risk') / 100, e = U.val(wrap, 'entry'), s = U.val(wrap, 'stop'), t = U.val(wrap, 'target');
      if (!(A > 0 && r > 0 && e > 0 && s > 0)) { $('out').innerHTML = '<div class="sc-note">계좌 총액, 손실 비율, 매수가, 손절가를 입력해 주세요.</div>'; return; }
      if (s >= e) { $('out').innerHTML = '<div class="sc-note warn">손절가는 매수가보다 낮아야 해요.</div>'; return; }
      var perShare = e - s, maxLoss = A * r, qty = Math.floor(maxLoss / perShare), cost = qty * e, weight = cost / A, lossPct = perShare / e;
      var capped = cost > A; if (capped) { qty = Math.floor(A / e); cost = qty * e; weight = cost / A; }
      var rr = t > e ? (t - e) / perShare : null;
      var rows = [0.5, 1, 2, 3, 5].map(function (p) { var q = Math.floor(A * p / 100 / perShare), c = q * e, over = c > A; if (over) { q = Math.floor(A / e); c = q * e; }
        return [p + '%', U.int(q) + '주', U.won(c) + '원', U.pct(c / A, 1) + (over ? ' (계좌 한도)' : '')]; });
      $('out').innerHTML = '<div class="sc-kpis">' +
        U.kpi('살 수 있는 수량', U.int(qty) + '<small>주</small>', '투입 ' + U.won(cost) + '원', true) +
        U.kpi('계좌 비중', U.pct(weight, 1), capped ? '계좌 전액 한도에 걸림' : '최대 손실 ' + U.won(qty * perShare) + '원') +
        U.kpi('손절 폭', '<span class="down">' + U.pct(-lossPct, 1, true) + '</span>', '주당 ' + U.won(perShare) + '원') + '</div>' +
        '<div class="sc-sec"><div class="sc-rows">' + U.row('감수하기로 한 손실', U.won(maxLoss) + '원 (계좌의 ' + U.pct(r, 1) + ')') +
        (rr !== null ? U.row('손익비 (목표가 기준)', '<b>1 : ' + rr.toFixed(2) + '</b> · 목표 도달 시 +' + U.won(qty * (t - e)) + '원 (계좌 ' + U.pct(qty * (t - e) / A, 1, true) + ')') : '') +
        (rr !== null ? U.row('본전 승률', '손익비 1:' + rr.toFixed(2) + '이면 ' + U.pct(1 / (1 + rr), 0) + ' 이상 맞혀야 본전') : '') + '</div></div>' +
        (capped ? '<div class="sc-sec"><div class="sc-note warn">손절 폭이 좁아서 계산상 수량이 계좌 전액을 넘어요. 계좌 전액 기준으로 줄였습니다. 손절가가 너무 가깝거나 비율이 큰 건 아닌지 확인하세요.</div></div>' : '') +
        '<div class="sc-sec"><div class="sc-sec-t">감수 손실 비율에 따라</div>' + U.table(['감수 손실', '수량', '투입금', '비중'], rows, [0.5, 1, 2, 3, 5].indexOf(r * 100)) + '</div>';
    }
    U.bindInputs(wrap, ['acct', 'risk', 'entry', 'stop', 'target'], calc);
    calc();
  }
  function reg() { window.SCTools.register({ id: 'position-size', css: CSS, render: render }); }
  if (window.SCTools) reg(); else document.addEventListener('DOMContentLoaded', function () { if (window.SCTools) reg(); });
})();

</script></body></html>
