<style>
.isync{
  --nct-bg:#FAF7F0; --nct-card:#FFFDF7; --nct-line:#E8E0D0;
  --nct-ink:#3D3529; --nct-sub:#8A7F6C; --nct-accent:#8B6F47;
  --nct-up:#C0392B; --nct-down:#2C6FA8; --nct-flat:#8A7F6C;
  background:var(--nct-bg); border:1px solid var(--nct-line); border-radius:14px;
  padding:22px; color:var(--nct-ink);
  font-family:'Noto Sans KR',-apple-system,BlinkMacSystemFont,sans-serif;
  line-height:1.6; max-width:100%; box-sizing:border-box;
}
.isync *{box-sizing:border-box;}
.isync-title{font-size:21px; font-weight:700; letter-spacing:-0.4px; margin-bottom:6px;}
.isync-lead{font-size:14px; color:var(--nct-sub); margin-bottom:18px;}
.isync-loading{padding:40px 0; text-align:center; color:var(--nct-sub); font-size:14px;}

.isync-mono{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;}
.up{color:var(--nct-up);} .down{color:var(--nct-down);} .flat{color:var(--nct-flat);}

/* 조회 카드 */
.isync-hero{
  background:var(--nct-card); border:2px solid var(--nct-accent); border-radius:12px;
  padding:18px; margin-bottom:18px;
}
.isync-hero-cap{font-size:12px; color:var(--nct-accent); font-weight:700; letter-spacing:0.4px; margin-bottom:10px;}
.isync-hero-us{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:14px;}
.isync-usbox{
  flex:1 1 140px; background:var(--nct-bg); border:1px solid var(--nct-line);
  border-radius:9px; padding:11px 13px;
}
.isync-usbox .nm{font-size:12px; color:var(--nct-sub); margin-bottom:3px;}
.isync-usbox .vl{font-size:22px; font-weight:700; letter-spacing:-0.5px;}
.isync-usbox .cl{font-size:11px; color:var(--nct-sub); margin-top:2px;}
.isync-hero-q{font-size:14px; margin-bottom:12px;}
.isync-hero-q b{color:var(--nct-accent);}
.isync-grid4{display:grid; grid-template-columns:repeat(4,1fr); gap:8px;}
.isync-cell{background:var(--nct-bg); border:1px solid var(--nct-line); border-radius:9px; padding:10px 8px; text-align:center;}
.isync-cell .k{font-size:11px; color:var(--nct-sub); margin-bottom:4px; white-space:nowrap;}
.isync-cell .v{font-size:17px; font-weight:700;}
.isync-badge{
  display:inline-block; font-size:11px; padding:2px 8px; border-radius:20px;
  background:#F0E9DA; color:var(--nct-sub); margin-left:6px; vertical-align:middle;
}
.isync-actual{
  margin-top:12px; padding-top:12px; border-top:1px dashed var(--nct-line);
  font-size:13px; color:var(--nct-sub);
}
.isync-actual b{color:var(--nct-ink);}

/* 페어 선택 */
.isync-pairs{display:flex; gap:7px; flex-wrap:wrap; margin-bottom:14px;}
.isync-pair{
  flex:1 1 auto; padding:9px 12px; border:1px solid var(--nct-line); border-radius:9px;
  background:var(--nct-card); color:var(--nct-sub); font-size:13px; font-weight:500;
  cursor:pointer; white-space:nowrap; text-align:center;
}
.isync-pair.on{background:var(--nct-accent); border-color:var(--nct-accent); color:#fff; font-weight:700;}

/* 탭 */
.isync-tabs{display:flex; gap:0; border-bottom:2px solid var(--nct-line); margin-bottom:16px;}
.isync-tab{
  padding:10px 14px; font-size:13.5px; color:var(--nct-sub); cursor:pointer;
  border-bottom:2px solid transparent; margin-bottom:-2px; font-weight:500; white-space:nowrap;
}
.isync-tab.on{color:var(--nct-accent); border-bottom-color:var(--nct-accent); font-weight:700;}

/* 카드 리스트 */
.isync-card{
  background:var(--nct-card); border:1px solid var(--nct-line); border-radius:11px;
  padding:15px; margin-bottom:11px;
}
.isync-card-t{font-size:15px; font-weight:700; margin-bottom:10px;}
.isync-kv{display:flex; justify-content:space-between; align-items:baseline; padding:6px 0; font-size:13.5px; border-bottom:1px dashed var(--nct-line);}
.isync-kv:last-child{border-bottom:none;}
.isync-kv .k{color:var(--nct-sub);}
.isync-kv .v{font-weight:700;}

.isync-bar-wrap{margin:10px 0 4px;}
.isync-bar-row{display:flex; align-items:center; gap:9px; margin-bottom:7px;}
.isync-bar-lb{font-size:12px; color:var(--nct-sub); width:56px; flex:none;}
.isync-bar-bg{flex:1; height:16px; background:#F0E9DA; border-radius:8px; overflow:hidden;}
.isync-bar-fl{height:100%; border-radius:8px;}
.isync-bar-vl{font-size:12.5px; font-weight:700; width:52px; text-align:right; flex:none;}

.isync-hint{font-size:12.5px; color:var(--nct-sub); margin-top:9px; padding-top:9px; border-top:1px dashed var(--nct-line);}

/* 표 */
.isync-tw{overflow-x:auto; -webkit-overflow-scrolling:touch;}
.isync-tb{width:100%; border-collapse:collapse; font-size:13px; min-width:460px;}
.isync-tb th{
  background:#F3EDE1; color:var(--nct-sub); font-size:11.5px; font-weight:700;
  padding:9px 7px; text-align:right; white-space:nowrap; border-bottom:1px solid var(--nct-line);
}
.isync-tb th:first-child{text-align:left;}
.isync-tb td{padding:9px 7px; text-align:right; border-bottom:1px solid var(--nct-line); white-space:nowrap;}
.isync-tb td:first-child{text-align:left; font-weight:500;}
.isync-tb tr:last-child td{border-bottom:none;}
.isync-tb tr.thin td{opacity:0.5;}

.isync-note{
  margin-top:18px; padding:13px 15px; background:#F3EDE1; border-radius:10px;
  font-size:12.5px; color:var(--nct-sub); line-height:1.65;
}
.isync-footer{margin-top:11px; font-size:11.5px; color:var(--nct-sub); text-align:right; line-height:1.7;}
.isync-err{padding:26px; text-align:center; color:var(--nct-sub); font-size:14px;}
.isync-btn{
  margin-top:12px; padding:9px 18px; border:1px solid var(--nct-accent); border-radius:8px;
  background:var(--nct-card); color:var(--nct-accent); font-size:13px; font-weight:700; cursor:pointer;
}

@media (max-width:480px){
  .isync{padding:15px; border-radius:11px;}
  .isync-title{font-size:18px;}
  .isync-lead{font-size:13px;}
  .isync-grid4{grid-template-columns:repeat(2,1fr);}
  .isync-usbox .vl{font-size:19px;}
  .isync-tab{padding:9px 10px; font-size:12.5px;}
  .isync-pair{font-size:12px; padding:8px 9px;}
  .isync-cell .v{font-size:15px;}
}
</style><style>
/* =========================================
   함께 보면 좋을 포스팅 v2 (모션 버전)
   붙여넣을 위치: 외모 > 사용자 정의하기 > 추가 CSS
   ========================================= */
.kkojae-related-wrap {
  --kr-gold: #d4a017;
  --kr-gold-dark: #b8860b;
  --kr-gold-light: #e8c547;
  --kr-card-bg: #fffdf4;
  --kr-line: #e8ddb8;
  --kr-ink: #2c2c2c;
  font-family: 'Noto Sans KR', sans-serif;
  margin: 2.5rem 0 1rem;
  padding: 0;
  box-sizing: border-box;
}
.kkojae-related-wrap *,
.kkojae-related-wrap *::before,
.kkojae-related-wrap *::after {
  box-sizing: border-box;
}

/* 워드프레스 자동 줄바꿈(<br>, 빈 <p>) 무력화 */
.kkojae-related-wrap br,
.kkojae-related-wrap p:empty {
  display: none !important;
}

/* ---------- 헤더: 숨 쉬는 양봉 캔들 ---------- */
.kkojae-related-wrap .kr-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1.1rem;
}
.kkojae-related-wrap .kr-header-bar {
  position: relative;
  flex-shrink: 0;
  width: 8px;
  height: 26px;
  background: none;
  border-radius: 0;
}
/* 꼬리(심지) */
.kkojae-related-wrap .kr-header-bar::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 2px;
  margin-left: -1px;
  background: var(--kr-gold-dark);
  border-radius: 1px;
}
/* 몸통 */
.kkojae-related-wrap .kr-header-bar::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 18px;
  margin-top: -9px;
  background: linear-gradient(180deg, var(--kr-gold-light), var(--kr-gold));
  border-radius: 2px;
  transform-origin: 50% 100%;
  animation: kr-candle 2.6s ease-in-out infinite;
}
.kkojae-related-wrap .kr-header-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--kr-ink);
  letter-spacing: -0.02em;
  line-height: 1.3;
  margin: 0;
}
.kkojae-related-wrap .kr-header-title span {
  color: var(--kr-gold-dark);
}

/* ---------- 그리드 ---------- */
.kkojae-related-wrap .kr-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

/* ---------- 카드 공통 ---------- */
.kkojae-related-wrap .kr-card {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  padding: 12px 14px;
  background: var(--kr-card-bg);
  border: 1px solid var(--kr-line);
  border-left: 3px solid var(--kr-gold);
  border-radius: 8px;
  color: inherit;
  text-decoration: none !important;
  box-shadow: none;
  transition: transform 0.25s cubic-bezier(.2, .8, .2, 1),
              box-shadow 0.25s ease,
              border-color 0.25s ease;
  -webkit-tap-highlight-color: transparent;
}
/* 호버 시 왼쪽에서 금빛이 차오르는 효과 */
.kkojae-related-wrap .kr-card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(90deg, rgba(232, 197, 71, 0.30), rgba(232, 197, 71, 0) 85%);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 0.35s cubic-bezier(.2, .8, .2, 1);
}
.kkojae-related-wrap .kr-card:hover,
.kkojae-related-wrap .kr-card:focus-visible {
  transform: translateY(-3px);
  border-color: var(--kr-gold-dark);
  box-shadow: 0 8px 20px rgba(180, 140, 20, 0.16);
}
.kkojae-related-wrap .kr-card:focus-visible {
  outline: 2px solid var(--kr-gold-dark);
  outline-offset: 2px;
}
.kkojae-related-wrap .kr-card:hover::before,
.kkojae-related-wrap .kr-card:focus-visible::before {
  transform: scaleX(1);
}
/* 모바일 탭 피드백 */
.kkojae-related-wrap .kr-card:active {
  transform: scale(0.98);
}

.kkojae-related-wrap .kr-card-icon {
  display: inline-block;
  flex-shrink: 0;
  font-size: 1.15rem;
  line-height: 1;
}
.kkojae-related-wrap .kr-card:hover .kr-card-icon {
  animation: kr-wiggle 0.5s ease;
}
.kkojae-related-wrap .kr-card-text {
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--kr-ink);
  line-height: 1.5;
  word-break: keep-all;
}

/* ---------- 대표 카드(첫 번째 카드): 빛이 지나가는 효과 ---------- */
.kkojae-related-wrap .kr-grid > .kr-card:first-child,
.kkojae-related-wrap .kr-card--featured {
  grid-column: 1 / -1;
  min-height: 62px;
  padding: 14px 16px;
  background: linear-gradient(120deg, #fff6cc 0%, #fffbe6 55%, #fff1bd 100%);
  border-color: #e9dc5c;
  border-left-color: var(--kr-gold);
}
.kkojae-related-wrap .kr-grid > .kr-card:first-child::before,
.kkojae-related-wrap .kr-card--featured::before {
  inset: -20% auto -20% 0;
  width: 40%;
  background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0));
  transform: translateX(-120%) skewX(-18deg);
  animation: kr-shine 3.8s ease-in-out infinite;
}
.kkojae-related-wrap .kr-grid > .kr-card:first-child .kr-card-icon,
.kkojae-related-wrap .kr-card--featured .kr-card-icon {
  font-size: 1.35rem;
  animation: kr-float 2.4s ease-in-out infinite;
}
.kkojae-related-wrap .kr-grid > .kr-card:first-child .kr-card-text,
.kkojae-related-wrap .kr-card--featured .kr-card-text {
  font-size: 0.9rem;
}
.kkojae-related-wrap .kr-card-text b {
  font-weight: 800;
  color: #8a6500;
}

/* ---------- 스크롤로 내려오면 카드가 차례로 떠오름 ---------- */
/* 지원 브라우저(크롬, 삼성인터넷, 최신 사파리)에서만 작동, 미지원 브라우저는 그냥 보임 */
@supports (animation-timeline: view()) {
  .kkojae-related-wrap .kr-card {
    animation: kr-rise linear both;
    animation-timeline: view();
    animation-range: entry 5% entry 75%;
  }
  .kkojae-related-wrap .kr-grid > a.kr-card:nth-of-type(2n+3) {
    animation-range: entry 15% entry 85%;
  }
}

/* ---------- 모바일 ---------- */
@media (max-width: 540px) {
  .kkojae-related-wrap .kr-grid {
    grid-template-columns: 1fr;
  }
  .kkojae-related-wrap .kr-grid > a.kr-card:nth-of-type(2n+3) {
    animation-range: entry 5% entry 75%;
  }
}

/* ---------- 움직임 최소화 설정한 사용자 배려 ---------- */
@media (prefers-reduced-motion: reduce) {
  .kkojae-related-wrap *,
  .kkojae-related-wrap *::before,
  .kkojae-related-wrap *::after {
    animation: none !important;
    transition: none !important;
  }
}

/* ---------- 키프레임 ---------- */
@keyframes kr-candle {
  0%, 100% { transform: scaleY(0.45); }
  40%      { transform: scaleY(1); }
  70%      { transform: scaleY(0.7); }
}
@keyframes kr-shine {
  0%        { transform: translateX(-120%) skewX(-18deg); }
  55%, 100% { transform: translateX(260%) skewX(-18deg); }
}
@keyframes kr-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}
@keyframes kr-wiggle {
  0%, 100% { transform: rotate(0) scale(1); }
  30%      { transform: rotate(-14deg) scale(1.18); }
  65%      { transform: rotate(9deg) scale(1.1); }
}
@keyframes kr-rise {
  from { opacity: 0; translate: 0 18px; }
  to   { opacity: 1; translate: 0 0; }
}
</style>

<body><div class="app-wrap"><div class="entry-content">
<div class="isync" id="isyncApp">

<script>

(function () {
  var CDN  = 'https://dooly870505-commits.github.io/stockchild-data/data/index-sync.json';
  var EXEC = 'https://script.google.com/macros/s/AKfycby91haCi8J9Ed7HwEvi8Tz4T6wplNJ5vf8DQOdhQIAZc96Yu_vc7f-bke0t6X0SLs1xqw/exec?tool=indexsync';

  var PAIR_ORDER = ['NASDAQ_KOSDAQ', 'DOW_KOSPI', 'NASDAQ_KOSPI', 'DOW_KOSDAQ'];
  var TABS = [
    { id: 'sum',  nm: '성적표' },
    { id: 'bkt',  nm: '구간별 반응' },
    { id: 'yr',   nm: '연도별 추이' },
    { id: 'div',  nm: '배신 데이' }
  ];

  var DATA = null, PAIR = 'NASDAQ_KOSDAQ', TAB = 'sum';
  var body = document.getElementById('isyncBody');
  var foot = document.getElementById('isyncFooter');

  /* ---------- 유틸 ---------- */
  function isNum(v) {
    if (v === null) return false;
    if (v === undefined) return false;
    if (typeof v !== 'number') return false;
    if (isNaN(v)) return false;
    return true;
  }
  function fx(v, d) { if (!isNum(v)) return '-'; return v.toFixed(d); }
  function sg(v, d) {
    if (!isNum(v)) return '-';
    var s = v > 0 ? '+' : '';
    return s + v.toFixed(d);
  }
  function cl(v) {
    if (!isNum(v)) return 'flat';
    if (v > 0) return 'up';
    if (v < 0) return 'down';
    return 'flat';
  }
  function esc(s) {
    return String(s).replace(/[&#038;<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function ymd(s) {
    var t = String(s);
    if (t.length !== 8) return t;
    return t.slice(0, 4) + '.' + t.slice(4, 6) + '.' + t.slice(6, 8);
  }
  function ymdShort(s) {
    var t = String(s);
    if (t.length !== 8) return t;
    return t.slice(2, 4) + '.' + t.slice(4, 6) + '.' + t.slice(6, 8);
  }

  /* ---------- 로딩 : CDN 먼저, 실패하면 Apps Script ---------- */
  function grab(url, ms) {
    return new Promise(function (ok, no) {
      var done = false;
      var timer = setTimeout(function () { if (!done) { done = true; no(new Error('timeout')); } }, ms);
      fetch(url, { cache: 'no-store' })
        .then(function (r) {
          if (!r.ok) throw new Error('http ' + r.status);
          return r.json();
        })
        .then(function (j) {
          if (done) return;
          done = true; clearTimeout(timer);
          if (j.error) { no(new Error(j.error)); return; }
          ok(j);
        })
        .catch(function (e) {
          if (done) return;
          done = true; clearTimeout(timer); no(e);
        });
    });
  }

  function load() {
    body.innerHTML = '<div class="isync-loading">데이터를 불러오는 중입니다</div>';
    grab(CDN, 4000)
      .catch(function () { return grab(EXEC, 12000); })
      .then(function (j) { DATA = j; render(); })
      .catch(function () {
        body.innerHTML = '<div class="isync-err">데이터를 불러오지 못했습니다.<br>' +
          '<button class="isync-btn" id="isyncRetry">다시 시도</button></div>';
        var b = document.getElementById('isyncRetry');
        if (b) b.onclick = load;
      });
  }

  /* ---------- 렌더 ---------- */
  function render() {
    if (!DATA) return;
    if (!DATA.pairs) { body.innerHTML = '<div class="isync-err">데이터 형식을 읽을 수 없습니다.</div>'; return; }
    if (!DATA.pairs[PAIR]) {
      var ks = Object.keys(DATA.pairs);
      if (!ks.length) { body.innerHTML = '<div class="isync-err">표시할 조합이 없습니다.</div>'; return; }
      PAIR = ks[0];
    }

    var html = heroHtml() + pairsHtml() + tabsHtml();
    if (TAB === 'sum') html += tabSum();
    if (TAB === 'bkt') html += tabBkt();
    if (TAB === 'yr')  html += tabYear();
    if (TAB === 'div') html += tabDiv();

    body.innerHTML = html;
    bind();
    footer();
  }

  function bind() {
    var ps = body.querySelectorAll('.isync-pair');
    for (var i = 0; ps.length > i; i++) {
      ps[i].onclick = function () { PAIR = this.getAttribute('data-k'); render(); };
    }
    var ts = body.querySelectorAll('.isync-tab');
    for (var j = 0; ts.length > j; j++) {
      ts[j].onclick = function () { TAB = this.getAttribute('data-k'); render(); };
    }
  }

  /* ---------- 조회 카드 ---------- */
  function heroHtml() {
    var L = DATA.latest;
    if (!L) return '';
    if (L.status === 'stale') {
      return '<div class="isync-hero"><div class="isync-hero-cap">데이터 갱신 지연</div>' +
             '<div class="isync-hero-q">최신 데이터를 받아오지 못했습니다. 아래 통계는 마지막 갱신 시점 기준입니다.</div></div>';
    }

    var p = DATA.pairs[PAIR];
    var usKey = p.us;
    var usRet = L.us[usKey] ? L.us[usKey].ret : null;
    var usNm = usKey === 'DJI' ? '다우' : '나스닥';
    var krNm = p.kr === 'KOSPI' ? '코스피' : '코스닥';

    var bk = null;
    if (L.bucket_key) {
      var key = L.bucket_key[usKey];
      if (key) {
        for (var i = 0; p.buckets.length > i; i++) {
          if (p.buckets[i].key === key) { bk = p.buckets[i]; break; }
        }
      }
    }

    var h = '<div class="isync-hero">';
    h += '<div class="isync-hero-cap">🌙 직전 미국장 마감 : ' + ymd(L.us_date) + ' ' + esc(L.us_weekday || '') + '요일</div>';

    h += '<div class="isync-hero-us">';
    h += usBox('다우', L.us.DJI);
    h += usBox('나스닥', L.us.IXIC);
    h += '</div>';

    if (!bk) {
      h += '<div class="isync-hero-q">해당 구간의 과거 기록을 찾지 못했습니다.</div></div>';
      return h;
    }

    h += '<div class="isync-hero-q">' + usNm + '이 <b>' + esc(bk.label) + '</b> 구간에서 마감한 날은 최근 5년간 <b>' +
         bk.past_n + '번</b>이었습니다. 그 다음 거래일 ' + krNm + '은 이렇게 움직였습니다.' +
         (bk.low_sample ? '<span class="isync-badge">표본 부족</span>' : '') + '</div>';

    h += '<div class="isync-grid4">';
    h += cell('시초가 평균', bk.kr_open_mean, '%');
    h += cell('종가 평균', bk.kr_close_mean, '%');
    h += cell('장중 평균', bk.kr_intra_mean, '%');
    h += cellPlain('상승 마감', fx(bk.kr_up_rate, 1) + '%');
    h += '</div>';

    if (L.status === 'pending') {
      h += '<div class="isync-actual">오늘 ' + krNm + ' 종가는 아직 확정되지 않았습니다. 장 마감 후 갱신됩니다.</div>';
    }
    if (L.actual) {
      var a = L.actual[p.kr];
      if (a) {
        h += '<div class="isync-actual">실제 ' + ymd(L.actual.kr_date) + ' ' + krNm + ' : 시초가 <b class="' + cl(a.open_gap) + '">' +
             sg(a.open_gap, 2) + '%</b> · 종가 <b class="' + cl(a.close_ret) + '">' + sg(a.close_ret, 2) +
             '%</b> · 장중 <b class="' + cl(a.intra) + '">' + sg(a.intra, 2) + '%</b></div>';
      }
    }
    h += '</div>';
    return h;
  }

  function usBox(nm, o) {
    if (!o) return '';
    return '<div class="isync-usbox"><div class="nm">' + nm + '</div>' +
           '<div class="vl isync-mono ' + cl(o.ret) + '">' + sg(o.ret, 2) + '%</div>' +
           '<div class="cl isync-mono">' + fx(o.close, 2) + '</div></div>';
  }
  function cell(k, v, unit) {
    return '<div class="isync-cell"><div class="k">' + k + '</div>' +
           '<div class="v isync-mono ' + cl(v) + '">' + sg(v, 2) + unit + '</div></div>';
  }
  function cellPlain(k, v) {
    return '<div class="isync-cell"><div class="k">' + k + '</div>' +
           '<div class="v isync-mono">' + v + '</div></div>';
  }

  /* ---------- 페어 선택 ---------- */
  function pairsHtml() {
    var h = '<div class="isync-pairs">';
    for (var i = 0; PAIR_ORDER.length > i; i++) {
      var k = PAIR_ORDER[i];
      var p = DATA.pairs[k];
      if (!p) continue;
      h += '<div class="isync-pair' + (k === PAIR ? ' on' : '') + '" data-k="' + k + '">' + esc(p.label) + '</div>';
    }
    return h + '</div>';
  }

  function tabsHtml() {
    var h = '<div class="isync-tabs">';
    for (var i = 0; TABS.length > i; i++) {
      h += '<div class="isync-tab' + (TABS[i].id === TAB ? ' on' : '') + '" data-k="' + TABS[i].id + '">' + TABS[i].nm + '</div>';
    }
    return h + '</div>';
  }

  /* ---------- 탭 1 : 성적표 ---------- */
  function tabSum() {
    var p = DATA.pairs[PAIR];
    var h = '<div class="isync-card">';
    h += '<div class="isync-card-t">' + esc(p.label) + ' 방향 일치율</div>';
    h += '<div class="isync-bar-wrap">';
    h += bar('시초가', p.hit_open_rate, '#8B6F47');
    h += bar('종가', p.hit_close_rate, '#C4A97D');
    h += '</div>';
    h += '<div class="isync-hint">시초가에서는 ' + fx(p.hit_open_rate, 1) + '% 같은 방향으로 열렸지만, 종가까지 가면 ' +
         fx(p.hit_close_rate, 1) + '%로 내려갑니다. 차이는 ' + fx(p.hit_drop_pt, 1) + '포인트입니다.</div>';
    h += '</div>';

    h += '<div class="isync-card">';
    h += '<div class="isync-card-t">세부 지표</div>';
    h += kv('시초가 상관계수', fx(p.open_corr, 2));
    h += kv('종가 상관계수', fx(p.close_corr, 2));
    h += kv('시초가 베타', fx(p.open_beta, 2) + ' 배');
    h += kv('종가 베타', fx(p.close_beta, 2) + ' 배');
    h += kv('장중 되돌림 비율', fx(p.reversal_rate, 1) + '%');
    h += kv('일간 변동 중 시초가 갭 비중', fx(p.gap_share, 1) + '%');
    h += '<div class="isync-hint">베타는 미국이 1% 움직였을 때 한국이 평균 몇 % 움직였는지를 뜻합니다. 되돌림 비율은 미국을 따라 갭이 열린 뒤 장중이 반대로 간 날의 비율입니다.</div>';
    h += '</div>';

    h += '<div class="isync-card"><div class="isync-card-t">4개 조합 비교</div><div class="isync-tw"><table class="isync-tb">';
    h += '<tr><th>조합</th><th>시초가 일치</th><th>종가 일치</th><th>감소</th><th>시초가 상관</th><th>종가 상관</th></tr>';
    for (var i = 0; PAIR_ORDER.length > i; i++) {
      var q = DATA.pairs[PAIR_ORDER[i]];
      if (!q) continue;
      h += '<tr><td>' + esc(q.label) + '</td>' +
           '<td class="isync-mono">' + fx(q.hit_open_rate, 1) + '%</td>' +
           '<td class="isync-mono">' + fx(q.hit_close_rate, 1) + '%</td>' +
           '<td class="isync-mono down">-' + fx(q.hit_drop_pt, 1) + 'p</td>' +
           '<td class="isync-mono">' + fx(q.open_corr, 2) + '</td>' +
           '<td class="isync-mono">' + fx(q.close_corr, 2) + '</td></tr>';
    }
    h += '</table></div></div>';
    return h;
  }

  function bar(lb, v, color) {
    var w = isNum(v) ? Math.max(0, Math.min(100, v)) : 0;
    return '<div class="isync-bar-row"><div class="isync-bar-lb">' + lb + '</div>' +
           '<div class="isync-bar-bg"><div class="isync-bar-fl" style="width:' + w + '%;background:' + color + ';"></div></div>' +
           '<div class="isync-bar-vl isync-mono">' + fx(v, 1) + '%</div></div>';
  }
  function kv(k, v) {
    return '<div class="isync-kv"><span class="k">' + k + '</span><span class="v isync-mono">' + v + '</span></div>';
  }

  /* ---------- 탭 2 : 구간별 반응 ---------- */
  function tabBkt() {
    var p = DATA.pairs[PAIR];
    var usNm = p.us === 'DJI' ? '다우' : '나스닥';
    var krNm = p.kr === 'KOSPI' ? '코스피' : '코스닥';

    var h = '<div class="isync-card"><div class="isync-card-t">' + usNm + ' 등락 구간별 ' + krNm + ' 반응</div>';
    h += '<div class="isync-tw"><table class="isync-tb">';
    h += '<tr><th>' + usNm + ' 구간</th><th>기록</th><th>시초가</th><th>종가</th><th>장중</th><th>상승 마감</th></tr>';
    h += rowsOf(p.buckets);
    h += '</table></div>';
    h += '<div class="isync-hint">회색으로 표시된 행은 기록이 30건 미만이라 참고만 하시는 편이 좋습니다.</div></div>';

    if (p.tails) {
      h += '<div class="isync-card"><div class="isync-card-t">누적 구간</div>';
      h += '<div class="isync-tw"><table class="isync-tb">';
      h += '<tr><th>' + usNm + ' 구간</th><th>기록</th><th>시초가</th><th>종가</th><th>장중</th><th>상승 마감</th></tr>';
      h += rowsOf(p.tails);
      h += '</table></div>';
      h += '<div class="isync-hint">양 끝 구간은 기록이 적어서, 경계를 넓힌 누적 기준도 함께 봅니다.</div></div>';
    }
    return h;
  }

  function rowsOf(arr) {
    var h = '';
    if (!arr) return h;
    for (var i = 0; arr.length > i; i++) {
      var b = arr[i];
      h += '<tr class="' + (b.low_sample ? 'thin' : '') + '"><td>' + esc(b.label) + '</td>' +
           '<td class="isync-mono">' + b.past_n + '</td>' +
           '<td class="isync-mono ' + cl(b.kr_open_mean) + '">' + sg(b.kr_open_mean, 2) + '</td>' +
           '<td class="isync-mono ' + cl(b.kr_close_mean) + '">' + sg(b.kr_close_mean, 2) + '</td>' +
           '<td class="isync-mono ' + cl(b.kr_intra_mean) + '">' + sg(b.kr_intra_mean, 2) + '</td>' +
           '<td class="isync-mono">' + fx(b.kr_up_rate, 1) + '%</td></tr>';
    }
    return h;
  }

  /* ---------- 탭 3 : 연도별 추이 ---------- */
  function tabYear() {
    var p = DATA.pairs[PAIR];
    if (!p.yearly) return '<div class="isync-card">연도별 데이터가 없습니다.</div>';
    if (p.yearly.length < 2) return '<div class="isync-card">연도별 데이터가 충분하지 않습니다.</div>';

    var h = '<div class="isync-card"><div class="isync-card-t">연도별 시초가 일치율</div><div class="isync-bar-wrap">';
    for (var i = 0; p.yearly.length > i; i++) {
      var y = p.yearly[i];
      h += bar(y.year + (y.partial ? '*' : ''), y.hit_open_rate, y.partial ? '#C9BCA4' : '#8B6F47');
    }
    h += '</div><div class="isync-hint">별표가 붙은 해는 거래일이 200일 미만이라 다른 해와 직접 비교하기 어렵습니다.</div></div>';

    h += '<div class="isync-card"><div class="isync-card-t">연도별 상세</div><div class="isync-tw"><table class="isync-tb">';
    h += '<tr><th>연도</th><th>거래일</th><th>시초가 일치</th><th>종가 일치</th><th>시초가 상관</th><th>종가 상관</th></tr>';
    for (var j = 0; p.yearly.length > j; j++) {
      var z = p.yearly[j];
      h += '<tr class="' + (z.partial ? 'thin' : '') + '"><td>' + z.year + (z.partial ? '*' : '') + '</td>' +
           '<td class="isync-mono">' + z.n + '</td>' +
           '<td class="isync-mono">' + fx(z.hit_open_rate, 1) + '%</td>' +
           '<td class="isync-mono">' + fx(z.hit_close_rate, 1) + '%</td>' +
           '<td class="isync-mono">' + fx(z.open_corr, 2) + '</td>' +
           '<td class="isync-mono">' + fx(z.close_corr, 2) + '</td></tr>';
    }
    h += '</table></div></div>';
    return h;
  }

  /* ---------- 탭 4 : 배신 데이 ---------- */
  function tabDiv() {
    var p = DATA.pairs[PAIR];
    if (!p.divergence_top) return '<div class="isync-card">기록이 없습니다.</div>';
    var usNm = p.us === 'DJI' ? '다우' : '나스닥';
    var krNm = p.kr === 'KOSPI' ? '코스피' : '코스닥';

    var h = '<div class="isync-card"><div class="isync-card-t">가장 크게 어긋난 날 (최근 5년 기준)</div>';
    h += '<div class="isync-tw"><table class="isync-tb">';
    h += '<tr><th>미국장</th><th>' + usNm + '</th><th>한국장</th><th>' + krNm + ' 시초가</th><th>' + krNm + ' 종가</th><th>격차</th></tr>';
    for (var i = 0; p.divergence_top.length > i; i++) {
      var d = p.divergence_top[i];
      h += '<tr><td class="isync-mono">' + ymdShort(d.us_date) + '</td>' +
           '<td class="isync-mono ' + cl(d.us_ret) + '">' + sg(d.us_ret, 2) + '</td>' +
           '<td class="isync-mono">' + ymdShort(d.kr_date) + '</td>' +
           '<td class="isync-mono ' + cl(d.kr_open_gap) + '">' + sg(d.kr_open_gap, 2) + '</td>' +
           '<td class="isync-mono ' + cl(d.kr_close_ret) + '">' + sg(d.kr_close_ret, 2) + '</td>' +
           '<td class="isync-mono">' + fx(d.spread, 2) + 'p</td></tr>';
    }
    h += '</table></div>';
    h += '<div class="isync-hint">미국과 한국이 서로 반대 방향으로 마감한 날 중 격차가 컸던 순서입니다. 왜 어긋났는지는 그날의 국내 사정을 따로 살펴봐야 알 수 있습니다.</div></div>';
    return h;
  }

  /* ---------- 푸터 ---------- */
  function footer() {
    var m = DATA.meta;
    if (!m) { foot.innerHTML = ''; return; }
    var t = String(m.generated_at || '').replace('T', ' ').slice(0, 16);
    foot.innerHTML = '집계 구간 ' + ymd(m.data_from) + ' ~ ' + ymd(m.data_to) + ' · ' + m.match_count + '거래일<br>' +
                     '기준시각 ' + esc(t) + ' · 출처 Yahoo Finance, Naver Finance<br>' +
                     '최근 5년 롤링 구간이라 기준일이 바뀌면 수치도 함께 이동합니다.';
  }

  load();
})();

</script>
<script>
(function () {
  var bodyEl = document.getElementById('adrmBody');
  var footEl = document.getElementById('adrmFooter');
  if (!bodyEl || !footEl) return; // ADR 위젯이 없는 페이지에서는 조용히 종료

  var CDN_URL = 'https://dooly870505-commits.github.io/stockchild-data/data/adr-monitor.json';
  var FALLBACK_URL = '';

  var state = { items: [], updated: '', sort: 'abs' };

  fetchData(CDN_URL).catch(function () {
    if (FALLBACK_URL) return fetchData(FALLBACK_URL);
    throw new Error('no fallback');
  }).catch(function () {
    bodyEl.innerHTML = '<div class="adrm-status">데이터를 불러오지 못했습니다.<br>잠시 후 새로고침해 주세요.</div>';
  });

  function fetchData(url) {
    return fetch(url, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (json) {
      var items = cleanItems(json && json.items);
      if (!items.length) throw new Error('empty');
      state.items = items;
      state.updated = String(json.updated || '');
      render();
    });
  }

  function cleanItems(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.map(function (it) {
      if (!it) return null;
      var adrUsd = Number(it.adrUsd);
      var krPrice = Number(it.krPrice);
      var fx = Number(it.fx);
      var ratio = Number(it.ratio);
      if (!isFinite(adrUsd) || !isFinite(krPrice) || !isFinite(ratio) || krPrice <= 0 || ratio <= 0) return null;
      var converted = Number(it.converted);
      if (!isFinite(converted) || converted <= 0) {
        if (!isFinite(fx) || fx <= 0) return null;
        converted = adrUsd * fx / ratio;
      }
      var gap = Number(it.gapPct);
      if (!isFinite(gap)) gap = (converted - krPrice) / krPrice * 100;
      return {
        name: String(it.name || ''),
        us: String(it.us || ''),
        kr: String(it.kr || '').replace(/\D/g, '').slice(0, 6),
        adrUsd: adrUsd,
        krPrice: krPrice,
        converted: Math.round(converted),
        gapPct: Math.round(gap * 100) / 100,
        ratio: ratio,
        adrDate: normDate(it.adrDate),
        krDate: normDate(it.krDate)
      };
    }).filter(function (x) { return x !== null; });
  }

  function normDate(v) {
    var s = String(v || '').slice(0, 10);
    return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';
  }

  function fmtWon(n) { return n.toLocaleString('ko-KR') + '원'; }
  function fmtUsd(n) { return '$' + n.toFixed(2); }
  function gapCls(g) { return g >= 0 ? 'up' : 'down'; }
  function gapTxt(g) { return (g >= 0 ? '+' : '') + g.toFixed(2) + '%'; }
  function ratioTxt(r) { return 'ADR 1주 = 원주 ' + r + '주'; }
  function shortDate(d) { return d ? d.slice(5) : '?'; }

  function gaugeHtml(gap, maxAbs) {
    var pct = Math.min(Math.abs(gap) / maxAbs, 1) * 50;
    var cls = gapCls(gap);
    return '<div class="adrm-gauge"><div class="adrm-gauge-zero"></div>' +
      '<div class="adrm-gauge-bar ' + cls + '" style="width:' + pct.toFixed(1) + '%"></div></div>' +
      '<div class="adrm-gauge-scale"><span>-' + maxAbs + '%</span><span>0</span><span>+' + maxAbs + '%</span></div>';
  }

  function dateWarn(it) {
    if (it.adrDate.length > 0) {
      if (it.krDate.length > 0) {
        if (it.adrDate !== it.krDate) {
          return '<div class="adrm-warn">⚠️ 기준일 다름: ADR ' + shortDate(it.adrDate) +
            ' / 원주 ' + shortDate(it.krDate) + ' (휴장 영향)</div>';
        }
      }
    }
    return '';
  }

  function render() {
    var items = state.items.slice();
    var hero = null;
    items = items.filter(function (it) {
      if (it.us === 'SKHY') {
        if (hero === null) { hero = it; return false; }
      }
      return true;
    });

    if (state.sort === 'abs') {
      items.sort(function (a, b) { return Math.abs(b.gapPct) - Math.abs(a.gapPct); });
    } else {
      items.sort(function (a, b) { return b.gapPct - a.gapPct; });
    }

    var all = hero ? [hero].concat(items) : items;
    var maxAbs = Math.max(10, Math.ceil(Math.max.apply(null, all.map(function (it) {
      return Math.abs(it.gapPct);
    })) / 5) * 5);

    var html = '';

    if (hero) {
      html += '<div class="adrm-hero">' +
        '<div class="adrm-hero-top">' +
        '<span class="adrm-hero-name">' + hero.name + '</span>' +
        '<span class="adrm-badge-new">나스닥 신규 상장</span>' +
        '<span class="adrm-chips"><span class="adrm-chip">KR ' + hero.kr + '</span>' +
        '<span class="adrm-chip">US ' + hero.us + '</span></span>' +
        '</div>' +
        '<div class="adrm-grid">' +
        cell('ADR 가격', fmtUsd(hero.adrUsd)) +
        cell('원화 환산가', fmtWon(hero.converted)) +
        cell('국내 원주가', fmtWon(hero.krPrice)) +
        '</div>' +
        '<div class="adrm-card-row"><span class="adrm-muted">' + ratioTxt(hero.ratio) + '</span>' +
        '<span class="adrm-gap adrm-gap-big ' + gapCls(hero.gapPct) + '">' + gapTxt(hero.gapPct) + '</span></div>' +
        gaugeHtml(hero.gapPct, maxAbs) +
        dateWarn(hero) +
        '</div>';
    }

    html += '<div class="adrm-sorts">' +
      sortBtn('abs', '괴리율 크기순') +
      sortBtn('desc', '프리미엄 높은순') +
      '</div>';

    items.forEach(function (it) {
      html += '<div class="adrm-card">' +
        '<div class="adrm-card-head">' +
        '<span class="adrm-card-name">' + it.name + '</span>' +
        '<span class="adrm-chips"><span class="adrm-chip">KR ' + it.kr + '</span>' +
        '<span class="adrm-chip">US ' + it.us + '</span></span>' +
        '</div>' +
        '<div class="adrm-card-row">' +
        '<span>ADR <span class="adrm-price">' + fmtUsd(it.adrUsd) + '</span>' +
        ' <span class="adrm-muted">→ 환산 ' + fmtWon(it.converted) + '</span></span>' +
        '<span>원주 <span class="adrm-price">' + fmtWon(it.krPrice) + '</span></span>' +
        '</div>' +
        '<div class="adrm-card-row"><span class="adrm-muted">' + ratioTxt(it.ratio) + '</span>' +
        '<span class="adrm-gap ' + gapCls(it.gapPct) + '">' + gapTxt(it.gapPct) + '</span></div>' +
        gaugeHtml(it.gapPct, maxAbs) +
        dateWarn(it) +
        '</div>';
    });

    bodyEl.innerHTML = html;
    footEl.textContent = '출처: Yahoo Finance, 네이버금융 | 기준: ' + state.updated + ' (하루 1회 갱신)';

    Array.prototype.forEach.call(bodyEl.querySelectorAll('.adrm-sort-btn'), function (btn) {
      btn.addEventListener('click', function () {
        state.sort = btn.getAttribute('data-sort');
        render();
      });
    });
  }

  function cell(label, value) {
    return '<div class="adrm-cell"><div class="adrm-cell-label">' + label +
      '</div><div class="adrm-cell-value">' + value + '</div></div>';
  }

  function sortBtn(key, label) {
    return '<button type="button" class="adrm-sort-btn' + (state.sort === key ? ' active' : '') +
      '" data-sort="' + key + '">' + label + '</button>';
  }
})();
</script>
</body></html>
