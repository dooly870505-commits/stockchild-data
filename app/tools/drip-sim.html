<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>배당 재투자 시뮬레이터</title><meta name="robots" content="noindex">
<style>:root{color-scheme:light}html,body{margin:0;background:#fff}.app-wrap{max-width:820px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}</style>
</head><body><div class="app-wrap"><div class="entry-content"><div data-sc-tool="drip-sim"></div></div></div>
<script src="https://dooly870505-commits.github.io/stockchild-data/js/sc-ui.js?v=1.0"></script>
<script>
/* stockchild.com 배당 재투자 시뮬레이터 (sc-tool-drip-sim) v1.0 (2026-11-03)
   초기 투자·월 적립·배당수익률·배당 성장률·주가 상승률·세율로 연도별 자산과 배당금을 계산. 재투자 vs 현금 수령 비교 */
(function () {
  'use strict';
  if (!window.SCTools) return;
  var CSS = ['.big{font-size:30px;font-weight:800;letter-spacing:-0.02em}'].join('');
  function sim(P, m, dy, dg, pg, years, tax, reinvest) {
    var shares = 1, price = 1; // 단위 주가 1원으로 정규화: 자산 = shares*price
    var cash = 0, cumDiv = 0, rows = [], invested = P; shares = P;
    for (var y = 1; y <= years; y++) {
      var divRate = dy * Math.pow(1 + dg, y - 1); // 주가 대비가 아닌 '매수 당시 수익률 기준 배당 성장' → 주당 배당 = price0*dy*(1+dg)^(y-1)
      var divPerShare = divRate; // price0 = 1
      var divGross = shares * divPerShare, divNet = divGross * (1 - tax);
      cumDiv += divNet;
      if (reinvest) shares += divNet / price; else cash += divNet;
      // 월 적립 (연중 균등, 연말 주가로 단순화)
      var add = m * 12; invested += add; shares += add / (price * (1 + pg / 2));
      price *= (1 + pg);
      rows.push({ y: y, asset: shares * price + cash, divNet: divNet, cumDiv: cumDiv, shares: shares, price: price, invested: invested, yieldOnCost: divGross / invested });
    }
    return rows;
  }
  function render(wrap, U) {
    wrap.innerHTML = '<div class="sc-card">' +
      U.header('배당', '배당 재투자 시뮬레이터', '받은 배당을 다시 사면 10년, 20년 뒤 얼마나 달라지는지 보여드려요. 배당 성장률과 주가 상승률도 넣을 수 있어요.') +
      '<div class="sc-sec"><div class="sc-grid">' + U.field('init', '초기 투자금', '만원', '1,000') + U.field('monthly', '월 적립', '만원', '50', '없으면 0', true) +
      U.field('dy', '현재 배당수익률', '%', '4') + U.field('dg', '연 배당 성장률', '%', '5', '배당금이 매년 얼마나 느는지') + U.field('pg', '연 주가 상승률', '%', '3') +
      U.field('years', '기간', '년', '20') + U.field('tax', '배당소득세', '%', '15.4') + '</div></div>' +
      '<div class="sc-sec" id="out"></div>' +
      U.foot('연 1회 배당·연말 재투자로 단순화한 모델입니다. 배당 성장률은 주당 배당금 기준이며, 미래 수익률을 보장하지 않습니다.') + '</div>';
    var $ = function (id) { return wrap.querySelector('#' + id); };
    function calc() {
      var P = U.val(wrap, 'init') * 1e4, m = (U.val(wrap, 'monthly') || 0) * 1e4, dy = U.val(wrap, 'dy') / 100, dg = U.val(wrap, 'dg') / 100, pg = U.val(wrap, 'pg') / 100, years = Math.round(U.val(wrap, 'years')), tax = U.val(wrap, 'tax') / 100;
      if (!(P >= 0) || !(years >= 1 && years <= 50) || !isFinite(dy) || !isFinite(dg) || !isFinite(pg) || !(P + m > 0)) { $('out').innerHTML = '<div class="sc-note">투자금, 배당수익률, 기간(1~50년)을 입력해 주세요.</div>'; return; }
      var A = sim(P, m, dy, dg, pg, years, tax, true), B = sim(P, m, dy, dg, pg, years, tax, false);
      var la = A[years - 1], lb = B[years - 1];
      var pick = [1, 3, 5, 10, 15, 20, 25, 30].filter(function (y) { return y <= years; }); if (pick.indexOf(years) < 0) pick.push(years);
      var rows = pick.map(function (y) { var a = A[y - 1], b = B[y - 1]; return [y + '년', U.won(a.asset / 1e4) + '만원', U.won(a.divNet / 1e4) + '만원 <span style="color:var(--muted)">(월 ' + U.won(a.divNet / 12 / 1e4) + '만)</span>', U.won(b.asset / 1e4) + '만원', '<span class="up">+' + U.won((a.asset - b.asset) / 1e4) + '만원</span>']; });
      $('out').innerHTML = '<div class="sc-kpis">' +
        U.kpi(years + '년 뒤 자산 (재투자)', '<span class="big">' + U.won(la.asset / 1e4) + '</span><small>만원</small>', '투입 원금 ' + U.won(la.invested / 1e4) + '만원', true) +
        U.kpi('그해 세후 배당', U.won(la.divNet / 1e4) + '<small>만원</small>', '월 ' + U.won(la.divNet / 12 / 1e4) + '만원 꼴') +
        U.kpi('재투자 효과', '<span class="up">+' + U.won((la.asset - lb.asset) / 1e4) + '</span><small>만원</small>', '현금으로 받았을 때보다') + '</div>' +
        '<div class="sc-sec"><div class="sc-rows">' + U.row('누적 세후 배당 (재투자)', U.won(la.cumDiv / 1e4) + '만원') + U.row('원금 대비 배당수익률 (Yield on Cost)', U.pct(la.yieldOnCost, 1) + ' (처음 ' + U.pct(dy, 1) + ')') +
        U.row('주가 상승 없이 배당만으로', U.won(sim(P, m, dy, dg, 0, years, tax, true)[years - 1].asset / 1e4) + '만원') + '</div></div>' +
        '<div class="sc-sec"><div class="sc-sec-t">연도별 비교</div>' + U.table(['연차', '자산 (재투자)', '그해 배당', '자산 (현금 수령)', '차이'], rows) + '</div>';
    }
    U.bindInputs(wrap, ['init', 'monthly', 'dy', 'dg', 'pg', 'years', 'tax'], calc);
    calc();
  }
  function reg() { window.SCTools.register({ id: 'drip-sim', css: CSS, render: render }); }
  if (window.SCTools) reg(); else document.addEventListener('DOMContentLoaded', function () { if (window.SCTools) reg(); });
})();

</script></body></html>
