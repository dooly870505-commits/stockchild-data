<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>매매일지</title><meta name="robots" content="noindex">
<style>:root{color-scheme:light}html,body{margin:0;background:#fff}.app-wrap{max-width:820px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}</style>
</head><body><div class="app-wrap"><div class="entry-content"><div data-sc-tool="trade-journal"></div></div></div>
<script src="https://dooly870505-commits.github.io/stockchild-data/js/sc-ui.js?v=1.0"></script>
<script>
/* stockchild.com 매매일지 (sc-tool-trade-journal) v1.0 (2026-11-03)
   기기(localStorage)에 매매 기록을 저장하고 FIFO 기준 실현손익, 승률, 월별 집계를 계산. CSV 복사·내보내기.
   앱에서 서버 저장으로 바꾸려면 load()/save() 두 함수만 교체하면 됨 */
(function () {
  'use strict';
  if (!window.SCTools) return;
  var KEY = 'sc_trade_journal_v1';
  var CSS = [
    '.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}',
    '.form .sc-field label{font-size:12px}.form .sc-input{height:44px}.form .sc-input input{text-align:left;font-size:15px}',
    '.form .sc-input input[type=date]{font-weight:500}',
    '.side{display:flex;gap:6px}.side .sc-chip{flex:1;text-align:center}.side .sc-chip.buy.on{background:var(--up);border-color:var(--up)}.side .sc-chip.sell.on{background:var(--down);border-color:var(--down)}',
    '.log{border-top:1px solid var(--line);margin-top:12px}',
    '.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:13.5px}',
    '.row .n{font-weight:700}.row .d{font-size:12px;color:var(--sub)}.row .pnl{font-weight:700;white-space:nowrap}',
    '.row .x{border:0;background:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px}',
    '.tag{display:inline-block;font-size:11px;font-weight:700;padding:1px 6px;border-radius:5px;margin-right:4px}.tag.b{background:var(--up-bg);color:var(--up)}.tag.s{background:var(--down-bg);color:var(--down)}',
    '.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.actions .sc-btn{height:40px;font-size:13px;padding:0 14px}',
    '.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px;border:1px dashed var(--line2);border-radius:12px;margin-top:12px}'
  ].join('');
  function load() { try { return JSON.parse(localStorage.getItem(KEY) || '[]'); } catch (e) { return []; } }
  function save(list) { try { localStorage.setItem(KEY, JSON.stringify(list)); } catch (e) {} }
  function today() { var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
  // FIFO 실현손익: 매도마다 가장 오래된 매수분부터 차감
  function realize(list) {
    var sorted = list.slice().sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : a.ts - b.ts; });
    var lots = {}, out = [];
    sorted.forEach(function (t) {
      var q = lots[t.name] || (lots[t.name] = []);
      if (t.side === 'buy') { q.push({ qty: t.qty, qty0: t.qty, price: t.price, fee: t.fee || 0 }); t.pnl = null; return; }
      var left = t.qty, cost = 0, matched = 0;
      while (left > 0 && q.length) { var l = q[0], take = Math.min(left, l.qty); cost += take * l.price + (l.fee || 0) * take / l.qty0; l.qty -= take; left -= take; matched += take; if (l.qty <= 0) q.shift(); }
      t.matched = matched; t.pnl = matched > 0 ? (t.price * matched - (t.fee || 0) - cost) : null; t.unmatched = left;
      out.push(t);
    });
    var open = {}; Object.keys(lots).forEach(function (n) { var q = lots[n], qty = 0, cost = 0; q.forEach(function (l) { qty += l.qty; cost += l.qty * l.price; }); if (qty > 0) open[n] = { qty: qty, avg: cost / qty }; });
    return { sells: out, open: open, all: sorted };
  }
  function render(wrap, U) {
    var S = { side: 'buy' };
    wrap.innerHTML = '<div class="sc-card">' +
      U.header('내 투자 기록', '매매일지', '사고판 기록을 남기면 실현손익과 승률, 월별 성적을 자동으로 계산해요. 이 기기에만 저장됩니다.') +
      '<div class="sc-sec"><div class="form">' +
      '<div class="sc-field"><label for="tj-date">날짜</label><div class="sc-input"><input id="tj-date" type="date" value="' + today() + '"></div></div>' +
      '<div class="sc-field"><label for="tj-name">종목</label><div class="sc-input"><input id="tj-name" placeholder="삼성전자" autocomplete="off"></div></div>' +
      '<div class="sc-field"><label>구분</label><div class="side"><button class="sc-chip buy on" data-s="buy" type="button">매수</button><button class="sc-chip sell" data-s="sell" type="button">매도</button></div></div>' +
      '<div class="sc-field"><label for="tj-qty">수량</label><div class="sc-input"><input id="tj-qty" inputmode="decimal" placeholder="10"><span class="u">주</span></div></div>' +
      '<div class="sc-field"><label for="tj-price">단가</label><div class="sc-input"><input id="tj-price" inputmode="decimal" placeholder="70,000"><span class="u">원</span></div></div>' +
      '<div class="sc-field"><label for="tj-fee">수수료·세금 <span class="opt">선택</span></label><div class="sc-input"><input id="tj-fee" inputmode="decimal" placeholder="0"><span class="u">원</span></div></div>' +
      '<div class="sc-field"><label for="tj-memo">메모 <span class="opt">선택</span></label><div class="sc-input"><input id="tj-memo" placeholder="매수 이유, 느낀 점"></div></div>' +
      '</div><div class="actions"><button class="sc-btn" id="tj-add" type="button">기록 추가</button><button class="sc-btn ghost" id="tj-copy" type="button">CSV 복사</button><button class="sc-btn ghost" id="tj-clear" type="button">전체 삭제</button></div><div id="tj-msg" class="sc-help"></div></div>' +
      '<div class="sc-sec" id="stats"></div><div class="sc-sec"><div class="sc-sec-t">기록</div><div id="log"></div></div>' +
      U.foot('실현손익은 선입선출(FIFO) 기준이며 입력한 수수료·세금만 반영합니다. 브라우저 데이터를 지우면 기록도 사라지니 가끔 CSV로 백업하세요.') + '</div>';
    var $ = function (id) { return wrap.querySelector('#' + id); };
    function draw() {
      var list = load(), R = realize(list), sells = R.sells.filter(function (t) { return t.pnl !== null; });
      var total = sells.reduce(function (a, t) { return a + t.pnl; }, 0), wins = sells.filter(function (t) { return t.pnl > 0; }).length;
      var months = {}; sells.forEach(function (t) { var m = t.date.slice(0, 7); months[m] = (months[m] || 0) + t.pnl; });
      var mrows = Object.keys(months).sort().reverse().slice(0, 12).map(function (m) { return [m, '<span class="' + U.tone(months[m]) + '">' + U.won(months[m]) + '원</span>']; });
      var openNames = Object.keys(R.open);
      $('stats').innerHTML = list.length ? '<div class="sc-kpis">' +
        U.kpi('실현손익 합계', '<span class="' + U.tone(total) + '">' + (total >= 0 ? '+' : '') + U.won(total) + '</span><small>원</small>', '매도 ' + sells.length + '건', true) +
        U.kpi('승률', sells.length ? U.pct(wins / sells.length, 0) : '-', sells.length ? wins + '승 ' + (sells.length - wins) + '패' : '매도 기록이 없어요') +
        U.kpi('보유 중', openNames.length + '<small>종목</small>', openNames.slice(0, 3).map(function (n) { return n + ' ' + U.int(R.open[n].qty) + '주'; }).join(', ')) + '</div>' +
        (mrows.length ? '<div class="sc-sec"><div class="sc-sec-t">월별 실현손익</div>' + U.table(['월', '손익'], mrows) + '</div>' : '') : '';
      var all = R.all.slice().reverse();
      $('log').innerHTML = all.length ? '<div class="log">' + all.map(function (t) {
        return '<div class="row"><div><div class="n"><span class="tag ' + (t.side === 'buy' ? 'b' : 's') + '">' + (t.side === 'buy' ? '매수' : '매도') + '</span>' + U.esc(t.name) + ' <span class="d">' + U.int(t.qty) + '주 × ' + U.won(t.price) + '원</span></div><div class="d">' + t.date + (t.memo ? ' · ' + U.esc(t.memo) : '') + (t.unmatched ? ' · 매수 기록 없는 ' + U.int(t.unmatched) + '주 제외' : '') + '</div></div>' +
          '<div style="display:flex;align-items:center;gap:4px">' + (t.pnl !== null && t.pnl !== undefined ? '<span class="pnl ' + U.tone(t.pnl) + '">' + (t.pnl >= 0 ? '+' : '') + U.won(t.pnl) + '원</span>' : '') + '<button class="x" data-del="' + t.ts + '" aria-label="삭제">✕</button></div></div>';
      }).join('') + '</div>' : '<div class="empty">아직 기록이 없어요. 첫 매매를 적어 보세요.</div>';
    }
    wrap.querySelector('.side').addEventListener('click', function (e) { var b = e.target.closest('[data-s]'); if (!b) return; S.side = b.getAttribute('data-s'); wrap.querySelectorAll('.side .sc-chip').forEach(function (c) { c.classList.toggle('on', c === b); }); });
    $('tj-add').addEventListener('click', function () {
      var name = $('tj-name').value.trim(), qty = U.num($('tj-qty').value), price = U.num($('tj-price').value), fee = U.num($('tj-fee').value) || 0, date = $('tj-date').value || today();
      if (!name || !(qty > 0) || !(price > 0)) { $('tj-msg').textContent = '종목, 수량, 단가를 입력해 주세요.'; return; }
      var list = load(); list.push({ ts: Date.now(), date: date, name: name, side: S.side, qty: qty, price: price, fee: fee, memo: $('tj-memo').value.trim() }); save(list);
      $('tj-qty').value = ''; $('tj-price').value = ''; $('tj-fee').value = ''; $('tj-memo').value = ''; $('tj-msg').textContent = '저장했어요.'; draw();
    });
    $('log').addEventListener('click', function (e) { var b = e.target.closest('[data-del]'); if (!b) return; var ts = +b.getAttribute('data-del'); save(load().filter(function (t) { return t.ts !== ts; })); draw(); });
    $('tj-clear').addEventListener('click', function () { if ($('tj-clear').dataset.arm) { save([]); delete $('tj-clear').dataset.arm; $('tj-clear').textContent = '전체 삭제'; draw(); } else { $('tj-clear').dataset.arm = '1'; $('tj-clear').textContent = '정말 삭제? 한 번 더'; setTimeout(function () { delete $('tj-clear').dataset.arm; $('tj-clear').textContent = '전체 삭제'; }, 3000); } });
    $('tj-copy').addEventListener('click', function () {
      var R = realize(load()); var csv = ['날짜,종목,구분,수량,단가,수수료,실현손익,메모'].concat(R.all.map(function (t) { return [t.date, t.name, t.side === 'buy' ? '매수' : '매도', t.qty, t.price, t.fee || 0, t.pnl == null ? '' : Math.round(t.pnl), (t.memo || '').replace(/,/g, ' ')].join(','); })).join('\n');
      var done = function () { $('tj-msg').textContent = 'CSV를 복사했어요. 메모장이나 스프레드시트에 붙여 넣으세요.'; };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(csv).then(done, function () { fallback(csv); }); else fallback(csv);
      function fallback(txt) { var ta = document.createElement('textarea'); ta.value = txt; wrap.appendChild(ta); ta.select(); try { document.execCommand('copy'); done(); } catch (e) { $('tj-msg').textContent = '복사가 안 되는 환경이에요.'; } wrap.removeChild(ta); }
    });
    draw();
  }
  function reg() { window.SCTools.register({ id: 'trade-journal', css: CSS, render: render }); }
  if (window.SCTools) reg(); else document.addEventListener('DOMContentLoaded', function () { if (window.SCTools) reg(); });
})();

</script></body></html>
