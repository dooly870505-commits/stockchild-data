<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>호가단위·가격제한폭 계산기</title><meta name="robots" content="noindex">
<style>:root{color-scheme:light}html,body{margin:0;background:#fff}.app-wrap{max-width:820px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}</style>
</head><body><div class="app-wrap"><div class="entry-content"><div data-sc-tool="tick-limit"></div></div></div>
<script src="https://dooly870505-commits.github.io/stockchild-data/js/sc-ui.js?v=1.0"></script>
<script>
/* stockchild.com 호가단위·가격제한폭 계산기 (sc-tool-tick-limit) v1.0 (2026-11-03)
   기준가 하나로 상한가·하한가, 호가단위, 한 틱이 몇 %인지, 목표가까지 몇 틱인지 계산.
   호가단위(2023-01-25 개편, 코스피·코스닥 공통): 2천 미만 1원, 5천 미만 5원, 2만 미만 10원, 5만 미만 50원, 20만 미만 100원, 50만 미만 500원, 그 이상 1,000원
   가격제한폭 ±30%. 상한가는 기준가의 130%를 호가단위로 내림, 하한가는 70%를 호가단위로 올림 */
(function () {
  'use strict';
  if (!window.SCTools) return;
  var CSS = ['.lim{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}', '.lim .sc-kpi .v{font-size:24px}', '.tk{font-size:12px;color:var(--muted)}'].join('');
  function tick(p) { if (p < 2000) return 1; if (p < 5000) return 5; if (p < 20000) return 10; if (p < 50000) return 50; if (p < 200000) return 100; if (p < 500000) return 500; return 1000; }
  function limitUp(b) { var x = b * 1.3; var t = tick(x); return Math.floor(x / t + 1e-9) * t; }
  function limitDown(b) { var x = b * 0.7; var t = tick(x); return Math.ceil(x / t - 1e-9) * t; }
  function ticksBetween(a, b) { var n = 0, p = Math.min(a, b), q = Math.max(a, b), guard = 0; while (p < q - 1e-9 && guard++ < 100000) { p += tick(p); n++; } return n; }
  function render(wrap, U) {
    wrap.innerHTML = '<div class="sc-card">' +
      U.header('계산기', '호가단위·가격제한폭 계산기', '기준가를 넣으면 오늘 상한가·하한가와 호가단위, 한 틱이 몇 %인지, 목표가까지 몇 틱인지 보여드려요.') +
      '<div class="sc-sec"><div class="sc-grid">' + U.field('base', '기준가 (전일 종가)', '원', '52,300') + U.field('target', '목표가', '원', '60,000', '비워도 돼요', true) + '</div>' +
      '<div class="sc-chips" style="margin-top:12px" id="ex"><button class="sc-chip" data-p="1500">1,500원</button><button class="sc-chip" data-p="9800">9,800원</button><button class="sc-chip" data-p="52300">52,300원</button><button class="sc-chip" data-p="198000">198,000원</button><button class="sc-chip" data-p="1250000">1,250,000원</button></div></div>' +
      '<div class="sc-sec" id="out"></div>' +
      '<div class="sc-sec"><div class="sc-sec-t">호가단위 표 (코스피·코스닥 공통)</div>' +
      U.table(['가격대', '호가단위'], [['2,000원 미만', '1원'], ['2,000 ~ 5,000원 미만', '5원'], ['5,000 ~ 20,000원 미만', '10원'], ['20,000 ~ 50,000원 미만', '50원'], ['50,000 ~ 200,000원 미만', '100원'], ['200,000 ~ 500,000원 미만', '500원'], ['500,000원 이상', '1,000원']]) + '</div>' +
      U.foot('ETF·ETN·ELW는 호가단위가 다릅니다(2,000원 미만 1원, 이상 5원). 상·하한가는 거래소 공식과 같은 방식으로 계산했지만 권리락·배당락 등 기준가 조정일에는 달라질 수 있어요.') + '</div>';
    var $ = function (id) { return wrap.querySelector('#' + id); };
    function calc() {
      var b = U.val(wrap, 'base'), tg = U.val(wrap, 'target');
      if (!(b > 0)) { $('out').innerHTML = '<div class="sc-note">기준가를 입력해 주세요.</div>'; return; }
      var t = tick(b), up = limitUp(b), dn = limitDown(b), tickPct = t / b;
      var h = '<div class="lim">' + U.kpi('상한가 (+30%)', '<span class="up">' + U.won(up) + '</span><small>원</small>', '기준가에서 ' + U.int(ticksBetween(b, up)) + '틱 위', true) +
        U.kpi('하한가 (−30%)', '<span class="down">' + U.won(dn) + '</span><small>원</small>', '기준가에서 ' + U.int(ticksBetween(dn, b)) + '틱 아래') + '</div>' +
        '<div class="sc-sec"><div class="sc-rows">' + U.row('호가단위', U.won(t) + '원') + U.row('한 틱의 크기', U.pct(tickPct, 3) + ' (' + U.won(t) + '원)') +
        U.row('한 틱 수익률 (수수료 전)', '1틱 먹으면 ' + U.pct(tickPct, 3) + ', 10틱이면 ' + U.pct(tickPct * 10, 2)) +
        U.row('호가단위가 바뀌는 가격', nextBoundary(b)) + '</div></div>';
      if (tg > 0) {
        var diff = tg - b, nt = ticksBetween(b, tg), out = tg > up ? '오늘 상한가(' + U.won(up) + '원)를 넘는 가격이라 오늘은 못 가요.' : tg < dn ? '오늘 하한가(' + U.won(dn) + '원) 아래라 오늘은 못 가요.' : '오늘 가격제한폭 안에 있어요.';
        h += '<div class="sc-sec"><div class="sc-sec-t">목표가 ' + U.won(tg) + '원까지</div><div class="sc-rows">' +
          U.row('차이', '<span class="' + U.tone(diff) + '">' + (diff >= 0 ? '+' : '') + U.won(diff) + '원 (' + U.pct(diff / b, 2, true) + ')</span>') +
          U.row('틱 수', U.int(nt) + '틱') + U.row('도달 가능', out) + '</div></div>';
      }
      $('out').innerHTML = h;
    }
    function nextBoundary(b) { var bs = [2000, 5000, 20000, 50000, 200000, 500000], i; for (i = 0; i < bs.length; i++) if (b < bs[i]) return U.won(bs[i]) + '원부터 ' + U.won(tick(bs[i])) + '원 단위'; return '최대 단위(1,000원)예요'; }
    U.bindInputs(wrap, ['base', 'target'], calc);
    $('ex').addEventListener('click', function (e) { var c = e.target.closest('[data-p]'); if (!c) return; U.set(wrap, 'base', +c.getAttribute('data-p')); calc(); });
    calc();
  }
  function reg() { window.SCTools.register({ id: 'tick-limit', css: CSS, render: render }); }
  if (window.SCTools) reg(); else document.addEventListener('DOMContentLoaded', function () { if (window.SCTools) reg(); });
})();

</script></body></html>
