<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>달러 환차손익 계산기</title><meta name="robots" content="noindex">
<style>:root{color-scheme:light}html,body{margin:0;background:#fff}.app-wrap{max-width:820px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}</style>
</head><body><div class="app-wrap"><div class="entry-content"><div data-sc-tool="fx-pnl"></div></div></div>
<script src="https://dooly870505-commits.github.io/stockchild-data/js/sc-ui.js?v=1.0"></script>
<script>
/* stockchild.com 달러 환차손익 계산기 (sc-tool-fx-pnl) v1.0 (2026-11-03)
   해외주식 원화 수익률을 주가 수익과 환차익으로 분해. 손익분기 환율, 환율 시나리오 표, 외화 평단가(2회 매수) */
(function () {
  'use strict';
  if (!window.SCTools) return;
  var CSS = ['.split{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}', '.split .b{background:var(--soft);border-radius:12px;padding:12px;text-align:center}', '.split .b .k{font-size:12px;color:var(--sub)}', '.split .b .v{font-size:20px;font-weight:700;margin-top:2px}', '@media(max-width:480px){.split{grid-template-columns:1fr}}'].join('');
  function render(wrap, U) {
    wrap.innerHTML = '<div class="sc-card">' +
      U.header('해외주식', '달러 환차손익 계산기', '내 수익이 주가 덕인지 환율 덕인지 나눠서 보여드려요. 환율이 얼마가 되면 본전인지도 같이 계산합니다.') +
      '<div class="sc-sec"><div class="sc-grid">' + U.field('fx0', '매수 때 환율', '원/$', '1,380') + U.field('fx1', '지금 환율', '원/$', '1,440') +
      U.field('p0', '매수가', '$', '180') + U.field('p1', '현재가', '$', '195') + U.field('qty', '수량', '주', '20') + '</div>' +
      '<div class="sc-grid" style="margin-top:12px">' + U.field('p2', '추가 매수가', '$', '0', '2차 매수가 있으면', true) + U.field('q2', '추가 수량', '주', '0', '', true) + U.field('fx2', '추가 매수 환율', '원/$', '0', '', true) + '</div></div>' +
      '<div class="sc-sec" id="out"></div>' +
      U.foot('환전 수수료·우대율과 매매 수수료는 반영하지 않았습니다. 양도세는 매매일 기준 환율로 계산되므로 신고 시 환율이 다를 수 있어요.') + '</div>';
    var $ = function (id) { return wrap.querySelector('#' + id); };
    function calc() {
      var fx0 = U.val(wrap, 'fx0'), fx1 = U.val(wrap, 'fx1'), p0 = U.val(wrap, 'p0'), p1 = U.val(wrap, 'p1'), q = U.val(wrap, 'qty');
      var p2 = U.val(wrap, 'p2') || 0, q2 = U.val(wrap, 'q2') || 0, fx2 = U.val(wrap, 'fx2') || 0;
      if (!(fx0 > 0 && fx1 > 0 && p0 > 0 && p1 > 0 && q > 0)) { $('out').innerHTML = '<div class="sc-note">환율 두 개, 매수가, 현재가, 수량을 입력해 주세요.</div>'; return; }
      var usdCost = p0 * q, krwCost = p0 * q * fx0, totQ = q, avgUsd = p0, avgFx = fx0;
      if (p2 > 0 && q2 > 0) { var f2 = fx2 > 0 ? fx2 : fx1; usdCost += p2 * q2; krwCost += p2 * q2 * f2; totQ += q2; avgUsd = usdCost / totQ; avgFx = krwCost / usdCost; }
      var nowUsd = p1 * totQ, nowKrw = nowUsd * fx1;
      var rUsd = nowUsd / usdCost - 1, rFx = fx1 / avgFx - 1, rTot = nowKrw / krwCost - 1, cross = rTot - rUsd - rFx;
      var beFx = krwCost / nowUsd;  // 지금 주가에서 본전이 되는 환율
      var rows = [-100, -50, 0, 50, 100, 150].map(function (d) { var f = fx1 + d, v = nowUsd * f, pnl = v - krwCost; return [U.won(f) + '원', U.won(v) + '원', '<span class="' + U.tone(pnl) + '">' + U.won(pnl) + '원</span>', '<span class="' + U.tone(pnl) + '">' + U.pct(pnl / krwCost, 2, true) + '</span>']; });
      $('out').innerHTML = '<div class="sc-kpis">' +
        U.kpi('원화 수익률', '<span class="' + U.tone(rTot) + '">' + U.pct(rTot, 2, true) + '</span>', '<span class="' + U.tone(nowKrw - krwCost) + '">' + U.won(nowKrw - krwCost) + '원</span> · 평가 ' + U.won(nowKrw) + '원', true) +
        U.kpi('달러 수익률', '<span class="' + U.tone(rUsd) + '">' + U.pct(rUsd, 2, true) + '</span>', '$' + U.won(nowUsd - usdCost) + ' · 평단 $' + avgUsd.toFixed(2)) +
        U.kpi('본전 환율', U.won(beFx) + '<small>원/$</small>', '지금 주가에서 환율이 이 아래면 손실') + '</div>' +
        '<div class="split"><div class="b"><div class="k">주가 기여</div><div class="v ' + U.tone(rUsd) + '">' + U.pct(rUsd, 2, true) + '</div></div><div class="b"><div class="k">환율 기여</div><div class="v ' + U.tone(rFx) + '">' + U.pct(rFx, 2, true) + '</div></div><div class="b"><div class="k">교차 효과</div><div class="v ' + U.tone(cross) + '">' + U.pct(cross, 2, true) + '</div></div></div>' +
        '<div class="sc-sec"><div class="sc-rows">' + U.row('원화 투자금', U.won(krwCost) + '원 (평균 환율 ' + U.won(avgFx) + '원)') + U.row('달러 투자금', '$' + U.won(usdCost)) +
        U.row('환차익만 따로', '<span class="' + U.tone(rFx) + '">' + U.won(usdCost * (fx1 - avgFx)) + '원</span> (달러 원금 기준)') + '</div></div>' +
        '<div class="sc-sec"><div class="sc-sec-t">환율이 움직이면 (현재가 $' + U.won(p1) + ' 고정)</div>' + U.table(['환율', '평가액', '손익', '수익률'], rows, 2) + '</div>';
    }
    U.bindInputs(wrap, ['fx0', 'fx1', 'p0', 'p1', 'qty', 'p2', 'q2', 'fx2'], calc);
    calc();
  }
  function reg() { window.SCTools.register({ id: 'fx-pnl', css: CSS, render: render }); }
  if (window.SCTools) reg(); else document.addEventListener('DOMContentLoaded', function () { if (window.SCTools) reg(); });
})();

</script></body></html>
