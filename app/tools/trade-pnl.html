<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>매매 손익 계산기</title><meta name="robots" content="noindex">
<style>:root{color-scheme:light}html,body{margin:0;background:#fff}.app-wrap{max-width:820px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}</style>
</head><body><div class="app-wrap"><div class="entry-content"><div data-sc-tool="trade-pnl"></div></div></div>
<script src="https://dooly870505-commits.github.io/stockchild-data/js/sc-ui.js?v=1.0"></script>
<script>
/* stockchild.com 매매 손익 계산기 (sc-tool-trade-pnl) v1.0 (2026-11-03)
   매수가·매도가·수량에 수수료와 매도 세금을 넣어 실현손익, 세후 수익률, 손익분기 매도가를 계산.
   기준: 2026년 국내 주식 매도 시 증권거래세 합계 0.20%, 국내 ETF 0%. 수수료 기본값 0.015% (매수·매도 각각) */
(function () {
  'use strict';
  if (!window.SCTools) return;
  var CSS = [
    '.kinds{margin-top:12px}',
    '.hint{font-size:12px;color:var(--muted);margin-top:8px}',
    '.pnl-big{font-size:34px;font-weight:800;letter-spacing:-0.02em}'
  ].join('');
  function render(wrap, U) {
    var S = { buy: 50000, sell: 55000, qty: 100, fee: 0.015, tax: 0.20, kind: 'stock' };
    wrap.innerHTML = '<div class="sc-card">' +
      U.header('계산기', '매매 손익 계산기', '수수료와 세금까지 뺀 진짜 손익을 보여드려요. 손익분기 매도가도 같이 계산합니다.') +
      '<div class="sc-sec"><div class="sc-grid">' +
      U.field('buy', '매수 단가', '원', U.int(S.buy)) + U.field('sell', '매도 단가', '원', U.int(S.sell)) +
      U.field('qty', '수량', '주', U.int(S.qty)) + '</div>' +
      '<div class="sc-chips kinds" id="kinds"><button class="sc-chip on" data-k="stock">국내 주식 0.20%</button><button class="sc-chip" data-k="etf">국내 ETF 0%</button><button class="sc-chip" data-k="custom">직접 입력</button></div>' +
      '<div class="sc-grid" style="margin-top:12px">' + U.field('fee', '매매 수수료 (편도)', '%', String(S.fee), '증권사마다 달라요. 매수·매도 각각 적용') +
      U.field('tax', '매도 세금 (거래세)', '%', String(S.tax), '매도할 때만 붙어요') + '</div></div>' +
      '<div class="sc-sec" id="out"></div>' +
      U.foot('수수료는 매수·매도 양쪽에, 거래세는 매도에만 적용했습니다. 해외주식 양도세는 별도 계산기를 이용하세요.') + '</div>';
    var $ = function (id) { return wrap.querySelector('#' + id); };
    function calc() {
      var b = U.val(wrap, 'buy'), s = U.val(wrap, 'sell'), q = U.val(wrap, 'qty'), f = U.val(wrap, 'fee') / 100, t = U.val(wrap, 'tax') / 100;
      if (!(b > 0 && s > 0 && q > 0) || !isFinite(f) || !isFinite(t)) { $('out').innerHTML = '<div class="sc-note">매수가, 매도가, 수량을 입력하면 바로 계산돼요.</div>'; return; }
      var buyAmt = b * q, sellAmt = s * q, feeBuy = buyAmt * f, feeSell = sellAmt * f, tax = sellAmt * t;
      var cost = buyAmt + feeBuy, net = sellAmt - feeSell - tax - cost, ret = net / cost, gross = sellAmt - buyAmt;
      var be = b * (1 + f) / (1 - f - t);
      var rows = [-10, -5, -3, 0, 3, 5, 10, 20].map(function (p) {
        var sp = b * (1 + p / 100), n = sp * q * (1 - f - t) - cost;
        return [U.pct(p / 100, 0, true) + ' (' + U.won(sp) + '원)', '<span class="' + U.tone(n) + '">' + U.won(n) + '원</span>', '<span class="' + U.tone(n) + '">' + U.pct(n / cost, 2, true) + '</span>'];
      });
      $('out').innerHTML = '<div class="sc-kpis">' +
        U.kpi('실현 손익 (세후)', '<span class="pnl-big ' + U.tone(net) + '">' + (net >= 0 ? '+' : '') + U.won(net) + '</span><small>원</small>', '세전 ' + (gross >= 0 ? '+' : '') + U.won(gross) + '원', true) +
        U.kpi('세후 수익률', '<span class="' + U.tone(ret) + '">' + U.pct(ret, 2, true) + '</span>', '투입 ' + U.won(cost) + '원 기준') +
        U.kpi('손익분기 매도가', U.won(be) + '<small>원</small>', '매수가 대비 ' + U.pct(be / b - 1, 2, true)) + '</div>' +
        '<div class="sc-sec"><div class="sc-rows">' + U.row('매수 금액', U.won(buyAmt) + '원') + U.row('매도 금액', U.won(sellAmt) + '원') +
        U.row('수수료 (매수 + 매도)', U.won(feeBuy + feeSell) + '원') + U.row('매도 세금', U.won(tax) + '원') +
        U.row('비용 합계', '<b>' + U.won(feeBuy + feeSell + tax) + '원</b> (매도 금액의 ' + U.pct((feeBuy + feeSell + tax) / sellAmt, 3) + ')') + '</div></div>' +
        '<div class="sc-sec"><div class="sc-sec-t">매도가에 따라</div>' + U.table(['매도가', '세후 손익', '수익률'], rows, 3) + '</div>';
    }
    U.bindInputs(wrap, ['buy', 'sell', 'qty', 'fee', 'tax'], calc);
    $('kinds').addEventListener('click', function (e) {
      var b = e.target.closest('[data-k]'); if (!b) return;
      wrap.querySelectorAll('#kinds .sc-chip').forEach(function (c) { c.classList.toggle('on', c === b); });
      var k = b.getAttribute('data-k'); if (k === 'stock') $('tax').value = '0.20'; if (k === 'etf') $('tax').value = '0'; calc();
    });
    calc();
  }
  function reg() { window.SCTools.register({ id: 'trade-pnl', css: CSS, render: render }); }
  if (window.SCTools) reg(); else document.addEventListener('DOMContentLoaded', function () { if (window.SCTools) reg(); });
})();

</script></body></html>
