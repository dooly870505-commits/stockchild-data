<style>
/* ===== 주식 계급표 (No.111) : 크림/베이지 시스템 ===== */
.nct-rank{
  --nct-bg:#FAF7F0; --nct-card:#FFFDF7; --nct-line:#E8E0D0;
  --nct-ink:#3D3529; --nct-sub:#8A7F6C; --nct-accent:#8B6F47;
  --nct-loss:#C0563A; --nct-gain:#5B8A5B; --nct-gold:#C79A3B;
  max-width:560px; margin:0 auto; padding:20px 16px 32px;
  background:var(--nct-bg); color:var(--nct-ink);
  font-family:'Noto Sans KR',sans-serif; line-height:1.6;
  border-radius:18px; box-sizing:border-box;
}
.nct-rank *{box-sizing:border-box;}

.nct-rank .nct-title{font-size:24px; font-weight:900; letter-spacing:-.5px; margin:0 0 6px;}
.nct-rank .nct-sub{font-size:13.5px; color:var(--nct-sub); margin:0 0 20px;}

/* 모드 토글 */
.nct-rank .nct-modes{display:flex; gap:8px; margin-bottom:14px;}
.nct-rank .nct-mode{
  flex:1; text-align:center; padding:11px 8px; cursor:pointer;
  background:var(--nct-card); border:1.5px solid var(--nct-line);
  border-radius:12px; font-size:14px; font-weight:700; color:var(--nct-sub);
  transition:all .15s; user-select:none;
}
.nct-rank .nct-mode.on{
  border-color:var(--nct-accent); color:var(--nct-accent);
  background:#F6F0E4; box-shadow:0 2px 8px rgba(139,111,71,.12);
}

/* 입력 카드 */
.nct-rank .nct-inputcard{
  background:var(--nct-card); border:1.5px solid var(--nct-line);
  border-radius:14px; padding:18px 16px; margin-bottom:14px;
}
.nct-rank .nct-field{margin-bottom:14px;}
.nct-rank .nct-field:last-of-type{margin-bottom:0;}
.nct-rank .nct-label{display:block; font-size:13px; font-weight:700; color:var(--nct-sub); margin-bottom:7px;}
.nct-rank .nct-inwrap{position:relative;}
.nct-rank .nct-input{
  width:100%; padding:13px 44px 13px 14px; font-size:16px;
  font-family:'JetBrains Mono',monospace; font-weight:700;
  border:1.5px solid var(--nct-line); border-radius:11px;
  background:#fff; color:var(--nct-ink); text-align:right; outline:none;
  transition:border-color .15s;
}
.nct-rank .nct-input:focus{border-color:var(--nct-accent);}
.nct-rank .nct-unit{
  position:absolute; right:14px; top:50%; transform:translateY(-50%);
  font-size:13px; color:var(--nct-sub); font-weight:500; pointer-events:none;
}
.nct-rank .nct-go{
  width:100%; padding:15px; margin-top:4px; cursor:pointer;
  background:var(--nct-accent); color:#fff; border:none; border-radius:12px;
  font-size:16px; font-weight:900; font-family:'Noto Sans KR',sans-serif;
  letter-spacing:-.3px; transition:opacity .15s;
}
.nct-rank .nct-go:active{opacity:.8;}

/* 탭 */
.nct-rank .nct-tabs{display:none; gap:8px; margin-bottom:14px;}
.nct-rank .nct-tabs.show{display:flex;}
.nct-rank .nct-tab{
  flex:1; text-align:center; padding:10px; cursor:pointer;
  border:1.5px solid var(--nct-line); border-radius:11px; background:var(--nct-card);
  font-size:13.5px; font-weight:700; color:var(--nct-sub); transition:all .15s; user-select:none;
}
.nct-rank .nct-tab.on{border-color:var(--nct-accent); color:var(--nct-accent); background:#F6F0E4;}

/* 결과 뱃지 카드 */
.nct-rank .nct-result{display:none;}
.nct-rank .nct-result.show{display:block; animation:nctFade .3s ease;}
@keyframes nctFade{from{opacity:0; transform:translateY(6px);}to{opacity:1; transform:none;}}

.nct-rank .nct-badge{
  border:2px solid var(--nct-line); border-radius:16px;
  padding:24px 18px; text-align:center; margin-bottom:14px;
  background:var(--nct-card);
}
.nct-rank .nct-badge.loss{border-color:var(--nct-loss); background:#FBF3F0;}
.nct-rank .nct-badge.gain{border-color:var(--nct-gain); background:#F1F7F1;}
.nct-rank .nct-badge.gold{border-color:var(--nct-gold); background:#FBF5E6;}
.nct-rank .nct-ret{font-size:14px; font-weight:700; color:var(--nct-sub); margin-bottom:2px;}
.nct-rank .nct-ret .nct-rnum{font-family:'JetBrains Mono',monospace;}
.nct-rank .nct-badge.loss .nct-rnum{color:var(--nct-loss);}
.nct-rank .nct-badge.gain .nct-rnum{color:var(--nct-gain);}
.nct-rank .nct-badge.gold .nct-rnum{color:var(--nct-gold);}
.nct-rank .nct-emblem{font-size:44px; line-height:1.1; margin:10px 0 4px; letter-spacing:2px;}
.nct-rank .nct-group{font-size:12.5px; font-weight:700; color:var(--nct-sub); letter-spacing:1px;}
.nct-rank .nct-rankname{font-size:34px; font-weight:900; letter-spacing:-1px; line-height:1.2; margin:2px 0 8px;}
.nct-rank .nct-desc{font-size:14.5px; font-weight:500; color:var(--nct-ink);}
.nct-rank .nct-next{
  font-size:12.5px; color:var(--nct-sub); margin-top:12px;
  padding-top:12px; border-top:1px dashed var(--nct-line);
}
.nct-rank .nct-next b{color:var(--nct-accent); font-family:'JetBrains Mono',monospace;}

/* 전체 계급표 */
.nct-rank .nct-tableview{display:none;}
.nct-rank .nct-tableview.show{display:block;}
.nct-rank .nct-row{
  display:flex; align-items:center; gap:12px;
  background:var(--nct-card); border:1.5px solid var(--nct-line);
  border-radius:12px; padding:11px 14px; margin-bottom:8px;
}
.nct-rank .nct-row.here{border-color:var(--nct-accent); background:#F6F0E4; box-shadow:0 2px 8px rgba(139,111,71,.1);}
.nct-rank .nct-remblem{font-size:20px; flex-shrink:0; width:44px; text-align:center; letter-spacing:1px;}
.nct-rank .nct-rinfo{flex:1; min-width:0;}
.nct-rank .nct-rname{font-size:15px; font-weight:900;}
.nct-rank .nct-rgroup{font-size:11.5px; color:var(--nct-sub);}
.nct-rank .nct-rrange{font-size:13px; font-weight:700; font-family:'JetBrains Mono',monospace; color:var(--nct-sub); white-space:nowrap;}

/* 복사 */
.nct-rank .nct-copy{
  width:100%; padding:13px; cursor:pointer; margin-bottom:16px;
  background:#fff; color:var(--nct-accent); border:1.5px solid var(--nct-accent);
  border-radius:12px; font-size:14.5px; font-weight:700;
  font-family:'Noto Sans KR',sans-serif; transition:all .15s;
}
.nct-rank .nct-copy:active{background:#F6F0E4;}
.nct-rank .nct-copy.done{background:var(--nct-accent); color:#fff;}

.nct-rank .nct-disc{
  font-size:12px; color:var(--nct-sub); line-height:1.7;
  background:#F3EEE3; border-radius:10px; padding:12px 14px; margin-bottom:12px;
}
.nct-rank .nct-foot{font-size:11.5px; color:var(--nct-sub); text-align:center;}

@media (max-width:480px){
  .nct-rank{padding:16px 12px 26px;}
  .nct-rank .nct-title{font-size:21px;}
  .nct-rank .nct-rankname{font-size:29px;}
  .nct-rank .nct-emblem{font-size:38px;}
}
</style><style>
/* =========================================
   함께 보면 좋을 포스팅 v2 (모션 버전)
   붙여넣을 위치: 외모 > 사용자 정의하기 > 추가 CSS
   ========================================= */
.kkojae-related-wrap {
  --kr-gold: #d4a017;
  --kr-gold-dark: #b8860b;
  --kr-gold-light: #e8c547;
  --kr-card-bg: #fffdf4;
  --kr-line: #e8ddb8;
  --kr-ink: #2c2c2c;
  font-family: 'Noto Sans KR', sans-serif;
  margin: 2.5rem 0 1rem;
  padding: 0;
  box-sizing: border-box;
}
.kkojae-related-wrap *,
.kkojae-related-wrap *::before,
.kkojae-related-wrap *::after {
  box-sizing: border-box;
}

/* 워드프레스 자동 줄바꿈(<br>, 빈 <p>) 무력화 */
.kkojae-related-wrap br,
.kkojae-related-wrap p:empty {
  display: none !important;
}

/* ---------- 헤더: 숨 쉬는 양봉 캔들 ---------- */
.kkojae-related-wrap .kr-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 1.1rem;
}
.kkojae-related-wrap .kr-header-bar {
  position: relative;
  flex-shrink: 0;
  width: 8px;
  height: 26px;
  background: none;
  border-radius: 0;
}
/* 꼬리(심지) */
.kkojae-related-wrap .kr-header-bar::before {
  content: "";
  position: absolute;
  top: 0;
  bottom: 0;
  left: 50%;
  width: 2px;
  margin-left: -1px;
  background: var(--kr-gold-dark);
  border-radius: 1px;
}
/* 몸통 */
.kkojae-related-wrap .kr-header-bar::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  top: 50%;
  height: 18px;
  margin-top: -9px;
  background: linear-gradient(180deg, var(--kr-gold-light), var(--kr-gold));
  border-radius: 2px;
  transform-origin: 50% 100%;
  animation: kr-candle 2.6s ease-in-out infinite;
}
.kkojae-related-wrap .kr-header-title {
  font-size: 1.05rem;
  font-weight: 800;
  color: var(--kr-ink);
  letter-spacing: -0.02em;
  line-height: 1.3;
  margin: 0;
}
.kkojae-related-wrap .kr-header-title span {
  color: var(--kr-gold-dark);
}

/* ---------- 그리드 ---------- */
.kkojae-related-wrap .kr-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

/* ---------- 카드 공통 ---------- */
.kkojae-related-wrap .kr-card {
  position: relative;
  overflow: hidden;
  isolation: isolate;
  display: flex;
  align-items: center;
  gap: 10px;
  min-height: 56px;
  padding: 12px 14px;
  background: var(--kr-card-bg);
  border: 1px solid var(--kr-line);
  border-left: 3px solid var(--kr-gold);
  border-radius: 8px;
  color: inherit;
  text-decoration: none !important;
  box-shadow: none;
  transition: transform 0.25s cubic-bezier(.2, .8, .2, 1),
              box-shadow 0.25s ease,
              border-color 0.25s ease;
  -webkit-tap-highlight-color: transparent;
}
/* 호버 시 왼쪽에서 금빛이 차오르는 효과 */
.kkojae-related-wrap .kr-card::before {
  content: "";
  position: absolute;
  inset: 0;
  z-index: -1;
  background: linear-gradient(90deg, rgba(232, 197, 71, 0.30), rgba(232, 197, 71, 0) 85%);
  transform: scaleX(0);
  transform-origin: left center;
  transition: transform 0.35s cubic-bezier(.2, .8, .2, 1);
}
.kkojae-related-wrap .kr-card:hover,
.kkojae-related-wrap .kr-card:focus-visible {
  transform: translateY(-3px);
  border-color: var(--kr-gold-dark);
  box-shadow: 0 8px 20px rgba(180, 140, 20, 0.16);
}
.kkojae-related-wrap .kr-card:focus-visible {
  outline: 2px solid var(--kr-gold-dark);
  outline-offset: 2px;
}
.kkojae-related-wrap .kr-card:hover::before,
.kkojae-related-wrap .kr-card:focus-visible::before {
  transform: scaleX(1);
}
/* 모바일 탭 피드백 */
.kkojae-related-wrap .kr-card:active {
  transform: scale(0.98);
}

.kkojae-related-wrap .kr-card-icon {
  display: inline-block;
  flex-shrink: 0;
  font-size: 1.15rem;
  line-height: 1;
}
.kkojae-related-wrap .kr-card:hover .kr-card-icon {
  animation: kr-wiggle 0.5s ease;
}
.kkojae-related-wrap .kr-card-text {
  font-size: 0.84rem;
  font-weight: 600;
  color: var(--kr-ink);
  line-height: 1.5;
  word-break: keep-all;
}

/* ---------- 대표 카드(첫 번째 카드): 빛이 지나가는 효과 ---------- */
.kkojae-related-wrap .kr-grid > .kr-card:first-child,
.kkojae-related-wrap .kr-card--featured {
  grid-column: 1 / -1;
  min-height: 62px;
  padding: 14px 16px;
  background: linear-gradient(120deg, #fff6cc 0%, #fffbe6 55%, #fff1bd 100%);
  border-color: #e9dc5c;
  border-left-color: var(--kr-gold);
}
.kkojae-related-wrap .kr-grid > .kr-card:first-child::before,
.kkojae-related-wrap .kr-card--featured::before {
  inset: -20% auto -20% 0;
  width: 40%;
  background: linear-gradient(100deg, rgba(255, 255, 255, 0), rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0));
  transform: translateX(-120%) skewX(-18deg);
  animation: kr-shine 3.8s ease-in-out infinite;
}
.kkojae-related-wrap .kr-grid > .kr-card:first-child .kr-card-icon,
.kkojae-related-wrap .kr-card--featured .kr-card-icon {
  font-size: 1.35rem;
  animation: kr-float 2.4s ease-in-out infinite;
}
.kkojae-related-wrap .kr-grid > .kr-card:first-child .kr-card-text,
.kkojae-related-wrap .kr-card--featured .kr-card-text {
  font-size: 0.9rem;
}
.kkojae-related-wrap .kr-card-text b {
  font-weight: 800;
  color: #8a6500;
}

/* ---------- 스크롤로 내려오면 카드가 차례로 떠오름 ---------- */
/* 지원 브라우저(크롬, 삼성인터넷, 최신 사파리)에서만 작동, 미지원 브라우저는 그냥 보임 */
@supports (animation-timeline: view()) {
  .kkojae-related-wrap .kr-card {
    animation: kr-rise linear both;
    animation-timeline: view();
    animation-range: entry 5% entry 75%;
  }
  .kkojae-related-wrap .kr-grid > a.kr-card:nth-of-type(2n+3) {
    animation-range: entry 15% entry 85%;
  }
}

/* ---------- 모바일 ---------- */
@media (max-width: 540px) {
  .kkojae-related-wrap .kr-grid {
    grid-template-columns: 1fr;
  }
  .kkojae-related-wrap .kr-grid > a.kr-card:nth-of-type(2n+3) {
    animation-range: entry 5% entry 75%;
  }
}

/* ---------- 움직임 최소화 설정한 사용자 배려 ---------- */
@media (prefers-reduced-motion: reduce) {
  .kkojae-related-wrap *,
  .kkojae-related-wrap *::before,
  .kkojae-related-wrap *::after {
    animation: none !important;
    transition: none !important;
  }
}

/* ---------- 키프레임 ---------- */
@keyframes kr-candle {
  0%, 100% { transform: scaleY(0.45); }
  40%      { transform: scaleY(1); }
  70%      { transform: scaleY(0.7); }
}
@keyframes kr-shine {
  0%        { transform: translateX(-120%) skewX(-18deg); }
  55%, 100% { transform: translateX(260%) skewX(-18deg); }
}
@keyframes kr-float {
  0%, 100% { transform: translateY(0); }
  50%      { transform: translateY(-3px); }
}
@keyframes kr-wiggle {
  0%, 100% { transform: rotate(0) scale(1); }
  30%      { transform: rotate(-14deg) scale(1.18); }
  65%      { transform: rotate(9deg) scale(1.1); }
}
@keyframes kr-rise {
  from { opacity: 0; translate: 0 18px; }
  to   { opacity: 1; translate: 0 0; }
}
</style>

<script>

(function(){
  var root = document.getElementById('nctRank');

  // 계급표 (낮은 수익률 -> 높은 수익률). min은 수익률(%) 하한
  // 장성급(별) 문턱을 +50%로 낮춰 인증 비율을 높인 구성
  var TIERS = [
    { min:-Infinity, rank:'관심 병사', group:'생존 신고',   emblem:'😵',        color:'loss', desc:'일단 살아 있는 게 어디예요. 존버도 실력입니다.' },
    { min:-30, rank:'이등병', group:'병',        emblem:'🔰',        color:'loss', desc:'이제 막 물렸습니다. 여기가 바닥이길 바랍니다.' },
    { min:-15, rank:'일등병', group:'병',        emblem:'🔰',        color:'loss', desc:'아직 마이너스지만 슬슬 요령이 생겼어요.' },
    { min:-5,  rank:'상등병', group:'병',        emblem:'🔰',        color:'loss', desc:'본전이 눈앞이에요. 조금만 더 버텨봐요.' },
    { min:0,   rank:'병장',   group:'병',        emblem:'🎖️',        color:'gain', desc:'드디어 플러스. 말년 병장의 여유가 느껴집니다.' },
    { min:5,   rank:'하사',   group:'부사관',    emblem:'🎗️',        color:'gain', desc:'부사관 임관. 이제 좀 아는 사람 소리 듣습니다.' },
    { min:10,  rank:'중사',   group:'부사관',    emblem:'🎗️',        color:'gain', desc:'수익률이 제법 자리를 잡았어요.' },
    { min:15,  rank:'상사',   group:'부사관',    emblem:'🎗️',        color:'gain', desc:'베테랑의 향기가 나기 시작합니다.' },
    { min:20,  rank:'소위',   group:'위관급',    emblem:'💎',        color:'gain', desc:'장교 임관. 20%를 넘겼어요.' },
    { min:25,  rank:'중위',   group:'위관급',    emblem:'💎',        color:'gain', desc:'수익이 수익을 부르는 구간입니다.' },
    { min:30,  rank:'대위',   group:'위관급',    emblem:'💎',        color:'gain', desc:'30% 돌파. 손이 매워지기 시작해요.' },
    { min:35,  rank:'소령',   group:'영관급',    emblem:'🌸',        color:'gain', desc:'영관급 진입. 이제 고수 소리 듣습니다.' },
    { min:40,  rank:'중령',   group:'영관급',    emblem:'🌸',        color:'gain', desc:'40% 구간. 별이 코앞입니다.' },
    { min:45,  rank:'대령',   group:'영관급',    emblem:'🌸',        color:'gain', desc:'한 걸음만 더. 곧 장군입니다.' },
    { min:50,  rank:'준장',   group:'장성급',    emblem:'⭐',        color:'gold', desc:'드디어 별을 답니다. 원금 1.5배 달성.' },
    { min:80,  rank:'소장',   group:'장성급',    emblem:'⭐⭐',      color:'gold', desc:'별 둘. 이 정도면 인증 올릴 자격 충분해요.' },
    { min:120, rank:'중장',   group:'장성급',    emblem:'⭐⭐⭐',    color:'gold', desc:'원금 두 배를 훌쩍 넘겼습니다.' },
    { min:200, rank:'대장',   group:'장성급',    emblem:'⭐⭐⭐⭐',  color:'gold', desc:'별 넷. 세 배의 사나이, 살아있는 전설.' },
    { min:900, rank:'원수',   group:'명예의 전당', emblem:'🌟',      color:'gold', desc:'텐베거 달성. 별 다섯, 역사에 남을 수익률.' }
  ];

  function $(id){ return document.getElementById(id); }

  function attachComma(el){
    el.addEventListener('input', function(){
      var v = el.value.replace(/[^0-9]/g,'');
      el.value = v ? Number(v).toLocaleString('ko-KR') : '';
    });
  }
  attachComma($('nctBuy')); attachComma($('nctNow'));

  // 수익률 입력은 음수/소수 허용
  $('nctRet').addEventListener('input', function(){
    this.value = this.value.replace(/[^0-9.\-]/g,'');
  });

  function numComma(id){ return Number(($(id).value||'').replace(/[^0-9]/g,'')) || 0; }

  var mode = 'direct';
  root.querySelectorAll('.nct-mode').forEach(function(m){
    m.addEventListener('click', function(){
      root.querySelectorAll('.nct-mode').forEach(function(x){ x.classList.remove('on'); });
      m.classList.add('on');
      mode = m.getAttribute('data-mode');
      $('nctDirect').style.display = (mode==='direct') ? 'block' : 'none';
      $('nctCalc').style.display   = (mode==='calc')   ? 'block' : 'none';
    });
  });

  // 탭 전환
  root.querySelectorAll('.nct-tab').forEach(function(t){
    t.addEventListener('click', function(){
      root.querySelectorAll('.nct-tab').forEach(function(x){ x.classList.remove('on'); });
      t.classList.add('on');
      var tab = t.getAttribute('data-tab');
      $('nctResult').classList.toggle('show', tab==='mine');
      $('nctTableView').classList.toggle('show', tab==='all');
    });
  });

  function findTier(ret){
    var idx = 0;
    for(var i=0;i<TIERS.length;i++){ if(ret >= TIERS[i].min) idx = i; }
    return idx;
  }

  function fmtRet(r){
    var rounded = Math.round(r*10)/10;
    return (rounded>0?'+':'') + rounded + '%';
  }

  function render(ret){
    var idx = findTier(ret);
    var t = TIERS[idx];

    var badge = $('nctBadge');
    badge.classList.remove('loss','gain','gold');
    badge.classList.add(t.color);

    $('nctRetShow').textContent = fmtRet(ret);
    $('nctEmblem').textContent = t.emblem;
    $('nctGroup').textContent = t.group;
    $('nctRankName').textContent = t.rank;
    $('nctDesc').textContent = t.desc;

    // 다음 계급까지
    if(idx < TIERS.length-1){
      var nt = TIERS[idx+1];
      var gap = Math.round((nt.min - ret)*10)/10;
      $('nctNext').innerHTML = '다음 계급 <b>' + nt.rank + '</b>까지 수익률 <b>+' + gap + '%p</b> 남았어요';
    } else {
      $('nctNext').innerHTML = '최고 계급입니다. 더 오를 곳이 없어요 🌟';
    }

    // 복사 텍스트
    root.dataset.copytext = '🎖️ 내 주식 계급은?\n수익률 ' + fmtRet(ret) + ' : ' + t.rank + ' (' + t.group + ')\n' + t.desc + '\nstockchild.com';

    // 전체 계급표에 현재 위치 표시
    buildTable(idx);

    $('nctTabs').classList.add('show');
    root.querySelectorAll('.nct-tab').forEach(function(x){ x.classList.remove('on'); });
    root.querySelector('.nct-tab[data-tab="mine"]').classList.add('on');
    $('nctResult').classList.add('show');
    $('nctTableView').classList.remove('show');
    $('nctCopy').classList.remove('done');
    $('nctCopy').textContent = '📋 계급장 복사하기';
  }

  function rangeLabel(i){
    var lo = TIERS[i].min;
    var hi = (i < TIERS.length-1) ? TIERS[i+1].min : null;
    if(lo === -Infinity) return '~ ' + hi + '%';
    if(hi === null) return lo + '% ~';
    return lo + ' ~ ' + hi + '%';
  }

  function buildTable(hereIdx){
    var list = $('nctTableList');
    list.innerHTML = '';
    for(var i=TIERS.length-1;i>=0;i--){
      var t = TIERS[i];
      var row = document.createElement('div');
      row.className = 'nct-row' + (i===hereIdx ? ' here' : '');
      row.innerHTML =
        '<div class="nct-remblem">' + t.emblem + '</div>' +
        '<div class="nct-rinfo">' +
          '<div class="nct-rname">' + t.rank + (i===hereIdx?' 👈':'') + '</div>' +
          '<div class="nct-rgroup">' + t.group + '</div>' +
        '</div>' +
        '<div class="nct-rrange">' + rangeLabel(i) + '</div>';
      list.appendChild(row);
    }
  }

  $('nctGo').addEventListener('click', function(){
    var ret;
    if(mode === 'direct'){
      ret = parseFloat(($('nctRet').value||'').replace(/[^0-9.\-]/g,''));
      if(isNaN(ret)) ret = 0;
    } else {
      var buy = numComma('nctBuy'), now = numComma('nctNow');
      ret = buy > 0 ? ((now - buy) / buy) * 100 : 0;
    }
    render(ret);
    setTimeout(function(){ $('nctTabs').scrollIntoView({behavior:'smooth', block:'nearest'}); }, 60);
  });

  $('nctCopy').addEventListener('click', function(){
    var t = root.dataset.copytext || '';
    var btn = $('nctCopy');
    function ok(){ btn.classList.add('done'); btn.textContent = '✅ 복사됐어요. 커뮤니티에 인증하세요!'; }
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(t).then(ok).catch(function(){ fallback(t); ok(); });
    } else { fallback(t); ok(); }
  });
  function fallback(t){
    var ta = document.createElement('textarea');
    ta.value = t; ta.style.position='fixed'; ta.style.opacity='0';
    document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); }catch(e){}
    document.body.removeChild(ta);
  }
})();

</script>
<script>
(function () {
  var bodyEl = document.getElementById('adrmBody');
  var footEl = document.getElementById('adrmFooter');
  if (!bodyEl || !footEl) return; // ADR 위젯이 없는 페이지에서는 조용히 종료

  var CDN_URL = 'https://dooly870505-commits.github.io/stockchild-data/data/adr-monitor.json';
  var FALLBACK_URL = '';

  var state = { items: [], updated: '', sort: 'abs' };

  fetchData(CDN_URL).catch(function () {
    if (FALLBACK_URL) return fetchData(FALLBACK_URL);
    throw new Error('no fallback');
  }).catch(function () {
    bodyEl.innerHTML = '<div class="adrm-status">데이터를 불러오지 못했습니다.<br>잠시 후 새로고침해 주세요.</div>';
  });

  function fetchData(url) {
    return fetch(url, { cache: 'no-store' }).then(function (res) {
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return res.json();
    }).then(function (json) {
      var items = cleanItems(json && json.items);
      if (!items.length) throw new Error('empty');
      state.items = items;
      state.updated = String(json.updated || '');
      render();
    });
  }

  function cleanItems(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.map(function (it) {
      if (!it) return null;
      var adrUsd = Number(it.adrUsd);
      var krPrice = Number(it.krPrice);
      var fx = Number(it.fx);
      var ratio = Number(it.ratio);
      if (!isFinite(adrUsd) || !isFinite(krPrice) || !isFinite(ratio) || krPrice <= 0 || ratio <= 0) return null;
      var converted = Number(it.converted);
      if (!isFinite(converted) || converted <= 0) {
        if (!isFinite(fx) || fx <= 0) return null;
        converted = adrUsd * fx / ratio;
      }
      var gap = Number(it.gapPct);
      if (!isFinite(gap)) gap = (converted - krPrice) / krPrice * 100;
      return {
        name: String(it.name || ''),
        us: String(it.us || ''),
        kr: String(it.kr || '').replace(/\D/g, '').slice(0, 6),
        adrUsd: adrUsd,
        krPrice: krPrice,
        converted: Math.round(converted),
        gapPct: Math.round(gap * 100) / 100,
        ratio: ratio,
        adrDate: normDate(it.adrDate),
        krDate: normDate(it.krDate)
      };
    }).filter(function (x) { return x !== null; });
  }

  function normDate(v) {
    var s = String(v || '').slice(0, 10);
    return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : '';
  }

  function fmtWon(n) { return n.toLocaleString('ko-KR') + '원'; }
  function fmtUsd(n) { return '$' + n.toFixed(2); }
  function gapCls(g) { return g >= 0 ? 'up' : 'down'; }
  function gapTxt(g) { return (g >= 0 ? '+' : '') + g.toFixed(2) + '%'; }
  function ratioTxt(r) { return 'ADR 1주 = 원주 ' + r + '주'; }
  function shortDate(d) { return d ? d.slice(5) : '?'; }

  function gaugeHtml(gap, maxAbs) {
    var pct = Math.min(Math.abs(gap) / maxAbs, 1) * 50;
    var cls = gapCls(gap);
    return '<div class="adrm-gauge"><div class="adrm-gauge-zero"></div>' +
      '<div class="adrm-gauge-bar ' + cls + '" style="width:' + pct.toFixed(1) + '%"></div></div>' +
      '<div class="adrm-gauge-scale"><span>-' + maxAbs + '%</span><span>0</span><span>+' + maxAbs + '%</span></div>';
  }

  function dateWarn(it) {
    if (it.adrDate.length > 0) {
      if (it.krDate.length > 0) {
        if (it.adrDate !== it.krDate) {
          return '<div class="adrm-warn">⚠️ 기준일 다름: ADR ' + shortDate(it.adrDate) +
            ' / 원주 ' + shortDate(it.krDate) + ' (휴장 영향)</div>';
        }
      }
    }
    return '';
  }

  function render() {
    var items = state.items.slice();
    var hero = null;
    items = items.filter(function (it) {
      if (it.us === 'SKHY') {
        if (hero === null) { hero = it; return false; }
      }
      return true;
    });

    if (state.sort === 'abs') {
      items.sort(function (a, b) { return Math.abs(b.gapPct) - Math.abs(a.gapPct); });
    } else {
      items.sort(function (a, b) { return b.gapPct - a.gapPct; });
    }

    var all = hero ? [hero].concat(items) : items;
    var maxAbs = Math.max(10, Math.ceil(Math.max.apply(null, all.map(function (it) {
      return Math.abs(it.gapPct);
    })) / 5) * 5);

    var html = '';

    if (hero) {
      html += '<div class="adrm-hero">' +
        '<div class="adrm-hero-top">' +
        '<span class="adrm-hero-name">' + hero.name + '</span>' +
        '<span class="adrm-badge-new">나스닥 신규 상장</span>' +
        '<span class="adrm-chips"><span class="adrm-chip">KR ' + hero.kr + '</span>' +
        '<span class="adrm-chip">US ' + hero.us + '</span></span>' +
        '</div>' +
        '<div class="adrm-grid">' +
        cell('ADR 가격', fmtUsd(hero.adrUsd)) +
        cell('원화 환산가', fmtWon(hero.converted)) +
        cell('국내 원주가', fmtWon(hero.krPrice)) +
        '</div>' +
        '<div class="adrm-card-row"><span class="adrm-muted">' + ratioTxt(hero.ratio) + '</span>' +
        '<span class="adrm-gap adrm-gap-big ' + gapCls(hero.gapPct) + '">' + gapTxt(hero.gapPct) + '</span></div>' +
        gaugeHtml(hero.gapPct, maxAbs) +
        dateWarn(hero) +
        '</div>';
    }

    html += '<div class="adrm-sorts">' +
      sortBtn('abs', '괴리율 크기순') +
      sortBtn('desc', '프리미엄 높은순') +
      '</div>';

    items.forEach(function (it) {
      html += '<div class="adrm-card">' +
        '<div class="adrm-card-head">' +
        '<span class="adrm-card-name">' + it.name + '</span>' +
        '<span class="adrm-chips"><span class="adrm-chip">KR ' + it.kr + '</span>' +
        '<span class="adrm-chip">US ' + it.us + '</span></span>' +
        '</div>' +
        '<div class="adrm-card-row">' +
        '<span>ADR <span class="adrm-price">' + fmtUsd(it.adrUsd) + '</span>' +
        ' <span class="adrm-muted">→ 환산 ' + fmtWon(it.converted) + '</span></span>' +
        '<span>원주 <span class="adrm-price">' + fmtWon(it.krPrice) + '</span></span>' +
        '</div>' +
        '<div class="adrm-card-row"><span class="adrm-muted">' + ratioTxt(it.ratio) + '</span>' +
        '<span class="adrm-gap ' + gapCls(it.gapPct) + '">' + gapTxt(it.gapPct) + '</span></div>' +
        gaugeHtml(it.gapPct, maxAbs) +
        dateWarn(it) +
        '</div>';
    });

    bodyEl.innerHTML = html;
    footEl.textContent = '출처: Yahoo Finance, 네이버금융 | 기준: ' + state.updated + ' (하루 1회 갱신)';

    Array.prototype.forEach.call(bodyEl.querySelectorAll('.adrm-sort-btn'), function (btn) {
      btn.addEventListener('click', function () {
        state.sort = btn.getAttribute('data-sort');
        render();
      });
    });
  }

  function cell(label, value) {
    return '<div class="adrm-cell"><div class="adrm-cell-label">' + label +
      '</div><div class="adrm-cell-value">' + value + '</div></div>';
  }

  function sortBtn(key, label) {
    return '<button type="button" class="adrm-sort-btn' + (state.sort === key ? ' active' : '') +
      '" data-sort="' + key + '">' + label + '</button>';
  }
})();
</script>
</body></html>
