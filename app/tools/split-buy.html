<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>분할매수 플래너</title><meta name="robots" content="noindex">
<style>:root{color-scheme:light}html,body{margin:0;background:#fff}.app-wrap{max-width:820px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}</style>
</head><body><div class="app-wrap"><div class="entry-content"><div data-sc-tool="split-buy"></div></div></div>
<script src="https://dooly870505-commits.github.io/stockchild-data/js/sc-ui.js?v=1.0"></script>
<script>
/* stockchild.com 분할매수 플래너 (sc-tool-split-buy) v1.0 (2026-11-03)
   총 예산을 몇 번에 나눠 살지, 몇 % 떨어질 때마다 살지 정하면 회차별 매수가·수량·누적 평단을 미리 보여줌.
   방식: 균등 / 피라미딩(내려갈수록 더 많이) / 역피라미딩(처음에 많이) */
(function () {
  'use strict';
  if (!window.SCTools) return;
  var CSS = ['.modes{margin-top:12px}', '.bar{height:10px;border-radius:999px;background:#E3E6EA;overflow:hidden;margin-top:6px}', '.bar i{display:block;height:100%;background:var(--brand)}'].join('');
  function render(wrap, U) {
    var S = { budget: 10000000, price: 50000, n: 4, step: 5, mode: 'equal' };
    wrap.innerHTML = '<div class="sc-card">' +
      U.header('계산기', '분할매수 플래너', '예산을 몇 번에 나눠 살지 정하면 회차별 매수가와 수량, 다 샀을 때 평단을 미리 계산해 드려요.') +
      '<div class="sc-sec"><div class="sc-grid">' +
      U.field('budget', '총 예산', '원', U.int(S.budget)) + U.field('price', '첫 매수가 (현재가)', '원', U.int(S.price)) +
      U.field('n', '분할 횟수', '회', String(S.n), '2~10회') + U.field('step', '매수 간격 (하락률)', '%', String(S.step), '이만큼 떨어질 때마다 한 번 더') + '</div>' +
      '<div class="sc-chips modes" id="modes"><button class="sc-chip on" data-m="equal">균등 분할</button><button class="sc-chip" data-m="pyr">피라미딩 (내려갈수록 더 많이)</button><button class="sc-chip" data-m="rev">역피라미딩 (처음에 많이)</button></div></div>' +
      '<div class="sc-sec" id="out"></div>' +
      U.foot('호가단위와 수수료는 반영하지 않은 계획표입니다. 실제 체결 수량은 호가단위에 맞춰 달라질 수 있어요.') + '</div>';
    var $ = function (id) { return wrap.querySelector('#' + id); };
    function calc() {
      var B = U.val(wrap, 'budget'), P = U.val(wrap, 'price'), n = Math.round(U.val(wrap, 'n')), st = U.val(wrap, 'step') / 100;
      if (!(B > 0 && P > 0) || !(n >= 2 && n <= 10) || !(st >= 0)) { $('out').innerHTML = '<div class="sc-note">예산, 첫 매수가, 분할 횟수(2~10), 간격을 입력해 주세요.</div>'; return; }
      var w = [], i; for (i = 0; i < n; i++) w.push(S.mode === 'equal' ? 1 : S.mode === 'pyr' ? i + 1 : n - i);
      var tw = w.reduce(function (a, b) { return a + b; }, 0);
      var cumQ = 0, cumM = 0, rows = [], maxQ = 0, plan = [];
      for (i = 0; i < n; i++) {
        var price = P * Math.pow(1 - st, i), money = B * w[i] / tw, qty = Math.floor(money / price), spent = qty * price;
        cumQ += qty; cumM += spent; var avg = cumQ ? cumM / cumQ : 0; maxQ = Math.max(maxQ, qty);
        plan.push({ i: i + 1, price: price, qty: qty, spent: spent, cumQ: cumQ, cumM: cumM, avg: avg });
      }
      plan.forEach(function (p) {
        rows.push([p.i + '회차', U.won(p.price) + '원 <span style="color:var(--muted)">(' + U.pct(p.price / P - 1, 1, true) + ')</span>', U.int(p.qty) + '주', U.won(p.spent) + '원', U.won(p.avg) + '원',
          '<div class="bar"><i style="width:' + Math.round(p.qty / maxQ * 100) + '%"></i></div>']);
      });
      var last = plan[n - 1], lastPrice = last.price, upToBe = last.avg / lastPrice - 1;
      $('out').innerHTML = '<div class="sc-kpis">' +
        U.kpi('다 샀을 때 평단', U.won(last.avg) + '<small>원</small>', '첫 매수가 대비 ' + U.pct(last.avg / P - 1, 1, true), true) +
        U.kpi('총 수량', U.int(last.cumQ) + '<small>주</small>', U.won(last.cumM) + '원 투입') +
        U.kpi('마지막 매수가', U.won(lastPrice) + '<small>원</small>', '거기서 평단까지 ' + U.pct(upToBe, 1, true) + ' 반등 필요') + '</div>' +
        '<div class="sc-sec"><div class="sc-sec-t">회차별 계획</div>' + U.table(['회차', '매수가', '수량', '금액', '누적 평단', '비중'], rows) + '</div>' +
        '<div class="sc-sec"><div class="sc-note">첫 회차만 사고 끝나면 평단은 <b>' + U.won(P) + '원</b>, 전부 체결되면 <b>' + U.won(last.avg) + '원</b>이에요. 중간에 반등하면 남은 예산은 그대로 현금으로 남습니다. 남은 예산 ' + U.won(B - last.cumM) + '원은 호가 끝수로 남는 돈이에요.</div></div>';
    }
    U.bindInputs(wrap, ['budget', 'price', 'n', 'step'], calc);
    $('modes').addEventListener('click', function (e) { var b = e.target.closest('[data-m]'); if (!b) return; S.mode = b.getAttribute('data-m');
      wrap.querySelectorAll('#modes .sc-chip').forEach(function (c) { c.classList.toggle('on', c === b); }); calc(); });
    calc();
  }
  function reg() { window.SCTools.register({ id: 'split-buy', css: CSS, render: render }); }
  if (window.SCTools) reg(); else document.addEventListener('DOMContentLoaded', function () { if (window.SCTools) reg(); });
})();

</script></body></html>
